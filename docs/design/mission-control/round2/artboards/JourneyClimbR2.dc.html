<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journey climb R2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div id="{{ rid }}" ref="{{ setRoot }}" style="box-sizing: border-box; width: {{ rootW }}; overflow: {{ rootOv }}; background: #0e0e14; color: #c0caf5; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace">
<div style="position: relative; width: {{ boxW }}; height: {{ boxH }}">
<canvas id="{{ cid }}" ref="{{ setCanvas }}" role="img" aria-label="{{ summary }}" style="display: block; width: {{ boxW }}; height: {{ boxH }}; background: #0e0e14"></canvas>
<sc-for list="{{ lanes }}" as="l" hint-placeholder-count="7"><div aria-hidden="true" style="position: absolute; left: {{ l.left }}; top: {{ l.top }}; font-size: {{ l.font }}; line-height: 1.3; letter-spacing: {{ l.track }}; text-transform: uppercase; color: {{ l.color }}">{{ l.label }}</div></sc-for>
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="8"><div aria-hidden="true" style="position: absolute; left: {{ b.left }}; top: {{ b.top }}; padding: {{ b.pad }}; background: {{ b.bg }}; overflow: hidden; white-space: nowrap; font-size: 10px; line-height: 14px; font-weight: {{ b.weight }}; color: {{ b.color }}">{{ b.label }}</div></sc-for>
<sc-for list="{{ ruler }}" as="r" hint-placeholder-count="8"><div aria-hidden="true" style="position: absolute; left: {{ r.left }}; top: {{ r.top }}; width: {{ r.width }}; overflow: hidden; white-space: nowrap; text-align: center; font-size: 10px; line-height: 14px; color: {{ r.color }}">{{ r.label }}</div></sc-for>
<div aria-hidden="true" style="position: absolute; left: {{ startLeft }}; top: {{ rulerTop }}; font-size: 10px; line-height: 14px; white-space: nowrap; color: #a9b1d6">{{ startClock }}</div>
<sc-if value="{{ isLive }}" hint-placeholder-val="{{ true }}"><div aria-hidden="true" style="position: absolute; left: {{ nowTagLeft }}; top: 0; padding: 0 4px; background: #7dcfff; color: #0c0e10; font-size: 10px; line-height: 14px; font-weight: 700; white-space: nowrap">NOW · {{ nowClock }}</div></sc-if>
<div aria-hidden="true" style="position: absolute; left: {{ tailLeft }}; right: {{ tailRight }}; top: {{ rulerTop }}; font-size: 10px; line-height: 14px; white-space: nowrap; color: {{ tailColor }}">{{ tailText }}</div>
<sc-for list="{{ cols }}" as="c" hint-placeholder-count="8"><button type="button" onClick="{{ c.pick }}" aria-label="{{ c.aria }}" aria-pressed="{{ c.on }}" style="position: absolute; left: {{ c.left }}; top: 0; width: {{ c.width }}; height: {{ c.height }}; padding: 0; border: 0; background: transparent; cursor: pointer"></button></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: {{ capPad }}; border-top: 1px solid #24283b; font-size: 12px; line-height: 1.5">
<sc-if value="{{ wideEnded }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 600; white-space: nowrap; color: {{ endColor }}">{{ endText }}</span></sc-if>
<sc-if value="{{ isWide }}" hint-placeholder-val="{{ true }}"><span style="color: #8b93b8">{{ capIndex }}</span></sc-if>
<span style="font-size: 13px; font-weight: 600; color: {{ capColor }}">{{ capState }}</span>
<span style="padding: 0 6px; border: 1px solid {{ capWhoColor }}; color: {{ capWhoColor }}; font-size: 11px; line-height: 1.6; white-space: nowrap">{{ capWho }}</span>
<span style="color: #c0caf5; white-space: nowrap">{{ capDur }}</span>
<sc-if value="{{ isWide }}" hint-placeholder-val="{{ true }}"><span style="flex: 1 1 240px; min-width: 0; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; font-size: 13px; color: #a9b1d6">{{ capNote }}</span></sc-if>
</div>
<sc-if value="{{ isWide }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 0 12px 12px; font-size: 12px; line-height: 1.5; color: #8b93b8">
<div role="group" aria-label="Time axis" style="display: flex; gap: 0">
<button type="button" onClick="{{ setSteps }}" aria-pressed="{{ stepsOn }}" style="height: 44px; padding: 0 12px; font-family: inherit; font-size: 12px; cursor: pointer; background: {{ stepsBg }}; color: {{ stepsFg }}; border: 1px solid {{ stepsBd }}">even steps</button>
<button type="button" onClick="{{ setTime }}" aria-pressed="{{ timeOn }}" style="height: 44px; padding: 0 12px; font-family: inherit; font-size: 12px; cursor: pointer; background: {{ timeBg }}; color: {{ timeFg }}; border: 1px solid {{ timeBd }}">to scale</button>
</div>
<sc-if value="{{ canReplay }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ replay }}" style="height: 44px; padding: 0 12px; font-family: inherit; font-size: 12px; cursor: pointer; background: #1f2230; color: #c0caf5; border: 1px solid #414868">replay</button></sc-if>
<span style="flex: 1 1 0"></span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 8px; background: #a9b1d6"></span>script</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 8px; background: #e0af68"></span>claude</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 8px; background: #7aa2f7"></span>codex</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 8px; background: #f7768e"></span>stopped</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 4px; height: 12px; background-image: repeating-linear-gradient(180deg, #c0caf5 0 4px, transparent 4px 8px)"></span>off-chart hop</span>
<span>timings are sample values</span>
</div>
</sc-if>
<sc-if value="{{ isCompact }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 0 12px 8px; font-size: 12px; line-height: 1.5; color: #8b93b8">
<sc-if value="{{ canReplay }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ replay }}" style="height: 44px; padding: 0 12px; font-family: inherit; font-size: 12px; cursor: pointer; background: #1f2230; color: #c0caf5; border: 1px solid #414868">replay</button></sc-if>
<sc-if value="{{ isEnded }}" hint-placeholder-val="{{ false }}"><span style="font-weight: 600; color: {{ endColor }}">{{ endText }}</span></sc-if>
<sc-if value="{{ isLive }}" hint-placeholder-val="{{ true }}">
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 8px; background: #a9b1d6"></span>script</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 8px; background: #e0af68"></span>claude</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 8px; background: #7aa2f7"></span>codex</span>
</sc-if>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scale":{"editor":"enum","options":["steps","time"],"default":"steps"},"motion":{"editor":"enum","options":["lively","calm"],"default":"lively"},"still":{"editor":"boolean","default":false},"ended":{"editor":"enum","options":["none","shipped","stopped"],"default":"none"},"compact":{"editor":"boolean","default":false},"path":{"editor":null},"who":{"editor":null},"jumps":{"editor":null},"future":{"editor":null},"notes":{"editor":null},"durs":{"editor":null},"start":{"editor":null},"end":{"editor":null},"sel":{"editor":null},"onPick":{"editor":null},"$preview":{"width":1000,"height":456}}'>
class Component extends DCLogic {
  /*
   * JourneyClimbR2: one ticket's journey through time. JourneyClimb plus two props.
   * Wide: a 250 x 84 cell grid (4 px cells), exactly as JourneyClimb.
   * compact="true" (phone): the grid is as wide as the container allows and 60 cells high;
   *   no names in the bars, short lane labels, even steps only, tap a bar to name it below.
   * ended="shipped": the journey is over and reached the flag; a green settle plays once, then nothing moves.
   * ended="stopped": the last bar lies on the red floor; nothing moves at all.
   * x = time (even steps, or to scale), y = how close to shipped; stop states are the floor.
   * Each visit is a bar in its lane, coloured by who did the work.
   * Only the bar a live ticket is in right now moves.
   */
  renderVals() {
    var self = this;
    if (!this._setCanvas) {
      this._cid = 'jc-' + Math.random().toString(36).slice(2, 10);
      this._rid = 'jr-' + Math.random().toString(36).slice(2, 10);
      this._setCanvas = function (el) {
        self._el = el || null;
        self._ctx = null;
        self._restSig = null;
      };
      this._setRoot = function (el) {
        self._root = el || null;
      };
      this._replay = function () {
        self._tPlay = performance.now();
      };
      this._setSteps = function () {
        self._tPlay = performance.now();
        self.setState({ scale: 'steps' });
      };
      this._setTime = function () {
        self._tPlay = performance.now();
        self.setState({ scale: 'time' });
      };
    }
    var s = this.state || {};
    var p = this.props;
    var compact = this._isCompact();
    var ended = this._ended();
    /* the phone chart has no time-scale toggle: even steps only */
    this._scale = compact ? 'steps' : (s.scale || (p.scale === 'time' ? 'time' : 'steps'));
    var m = this._model();
    var G = m.g;
    /* a page can own the selection (sel + onPick) so a log beside the chart stays in step */
    var want = (p.sel === undefined || p.sel === null || p.sel === '') ? s.sel : Number(p.sel);
    var sel = (want === undefined || want === null || !(want >= 0) || want >= m.n) ? m.n - 1 : want;
    this._sel = sel;
    var cols = [];
    for (var i = 0; i < m.n; i++) cols.push(this._col(i, sel, m));
    var v = m.visits[sel];
    var isLast = sel === m.n - 1;
    var isNow = isLast && !ended;
    var stepsOn = this._scale === 'steps';
    /* the current visit of a live ticket keeps counting */
    var nowDur = m.n ? this._fmt(m.visits[m.n - 1].dur + (ended ? 0 : (s.sec || 0))) : '';
    var ruler = m.rulerLabels;
    if (m.nowLabelIdx >= 0) {
      ruler = m.rulerLabels.slice();
      ruler[m.nowLabelIdx] = { label: nowDur, left: ruler[m.nowLabelIdx].left, top: ruler[m.nowLabelIdx].top, width: ruler[m.nowLabelIdx].width, color: '#7dcfff' };
    }
    var on = ['rgba(158,206,106,0.09)', '#9ece6a', '#9ece6a'], off = ['#1f2230', '#c0caf5', '#414868'];

    var capState = v.name, capColor = '#c0caf5', capDur = 'took ' + v.durText;
    if (isNow) {
      capState = v.name + ' · now';
      capColor = '#7dcfff';
      capDur = nowDur + ' so far';
    } else if (isLast && ended === 'shipped') {
      capState = v.name + ' · shipped';
      capColor = '#9ece6a';
    } else if (isLast && ended === 'stopped') {
      capState = v.name + ' · stopped';
      capColor = '#f7768e';
      capDur = 'for ' + v.durText;
    }

    /* the NOW tag sits over the now line; on a phone it is pulled in so it never leaves the canvas */
    var nowLeft = m.nowX * 4 - 20;
    if (compact) {
      var tagW = Math.ceil(8 + 6.1 * (6 + String(m.nowClock).length));
      nowLeft = Math.max(0, Math.min(nowLeft, G.w * 4 - tagW));
    }

    /* after the last bar: what is ahead (live), or when it ended */
    var tailText = '', tailColor = '#8b93b8';
    if (ended === 'shipped') {
      tailText = v ? m.visits[m.n - 1].name + ' ' + m.endClock : '';
      tailColor = '#9ece6a';
    } else if (ended === 'stopped') {
      tailText = 'stopped ' + m.endClock;
      tailColor = '#f7768e';
    } else if (!compact && m.hops > 0) {
      tailText = 'ahead · ' + m.hops + '+ hops to shipped';
    }

    return {
      rid: this._rid,
      setRoot: this._setRoot,
      cid: this._cid,
      setCanvas: this._setCanvas,
      rootW: compact ? '100%' : '1000px',
      rootOv: compact ? 'hidden' : 'visible',
      boxW: (G.w * 4) + 'px',
      boxH: (G.h * 4) + 'px',
      summary: m.summary,
      lanes: m.laneLabels,
      bars: m.barLabels,
      ruler: ruler,
      cols: cols,
      startClock: m.startClock,
      startLeft: compact ? '4px' : '10px',
      rulerTop: G.rulerTop + 'px',
      nowClock: m.nowClock,
      nowTagLeft: nowLeft + 'px',
      tailLeft: compact ? 'auto' : (m.nowX * 4 + 12) + 'px',
      tailRight: compact ? '4px' : 'auto',
      tailText: tailText,
      tailColor: tailColor,
      isWide: !compact,
      isCompact: compact,
      isLive: !ended,
      isEnded: !!ended,
      wideEnded: !compact && !!ended,
      canReplay: ended !== 'stopped',
      endText: m.endText,
      endColor: ended === 'stopped' ? '#f7768e' : '#9ece6a',
      capPad: compact ? '8px 12px' : '10px 12px',
      capIndex: (sel < 9 ? '0' : '') + (sel + 1) + ' of ' + m.n,
      capState: capState,
      capColor: capColor,
      capWho: v.who,
      capWhoColor: v.whoHex,
      capDur: capDur,
      capNote: v.note,
      replay: this._replay,
      setSteps: this._setSteps,
      setTime: this._setTime,
      stepsOn: stepsOn,
      timeOn: !stepsOn,
      stepsBg: stepsOn ? on[0] : off[0], stepsFg: stepsOn ? on[1] : off[1], stepsBd: stepsOn ? on[2] : off[2],
      timeBg: stepsOn ? off[0] : on[0], timeFg: stepsOn ? off[1] : on[1], timeBd: stepsOn ? off[2] : on[2]
    };
  }

  _col(i, sel, m) {
    var self = this;
    return {
      left: (m.visits[i].x * 4) + 'px',
      width: (m.visits[i].w * 4) + 'px',
      height: m.g.hitH + 'px',
      on: i === sel,
      aria: 'visit ' + (i + 1) + ', ' + m.visits[i].name + ', ' + m.visits[i].durText,
      pick: function () {
        self._selAt = performance.now();
        self.setState({ sel: i });
        if (typeof self.props.onPick === 'function') self.props.onPick(i);
      }
    };
  }

  _isCompact() {
    var c = this.props.compact;
    return c === true || c === 'true';
  }

  /* '' (live), 'shipped' or 'stopped' */
  _ended() {
    var e = String(this.props.ended === undefined || this.props.ended === null ? '' : this.props.ended);
    return (e === 'shipped' || e === 'stopped') ? e : '';
  }

  componentDidMount() {
    var self = this;
    this._dead = false;
    this._t0 = performance.now();
    this._last = 0;
    this._frames = 0;
    var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    this._sysStill = !!(mq && mq.matches);
    /* phone: size the canvas from the container, now and whenever it changes */
    this._measure();
    this._onResize = function () {
      self._measure();
    };
    window.addEventListener('resize', this._onResize);
    if (window.ResizeObserver) {
      try {
        var root = this._root || document.getElementById(this._rid);
        this._ro = new window.ResizeObserver(this._onResize);
        if (root) this._ro.observe(root);
      } catch (e) {
        this._ro = null;
      }
    }
    this._iv = window.setInterval(function () {
      var p = self.props;
      /* only a live ticket keeps counting */
      if (self._sysStill || p.still === true || p.still === 'true' || self._ended()) return;
      self.setState({ sec: ((self.state && self.state.sec) || 0) + 1 });
    }, 1000);
    var loop = function (now) {
      if (self._dead) return;
      self._raf = window.requestAnimationFrame(loop);
      if (now - self._last < 47) return;
      self._last = now;
      self._frames += 1;
      if (self._frames % 20 === 0) self._measure();
      /* a chart that has come to rest is not redrawn until something changes */
      if (self._restSig && self._restSig === self._sig()) return;
      try { self._draw(now); } catch (e) { self._dead = true; }
    };
    try { this._draw(performance.now()); } catch (e) { this._dead = true; }
    this._raf = window.requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    this._dead = true;
    if (this._raf) window.cancelAnimationFrame(this._raf);
    if (this._iv) window.clearInterval(this._iv);
    if (this._onResize) window.removeEventListener('resize', this._onResize);
    if (this._ro) this._ro.disconnect();
  }

  /* Compact only: the width the chart may take, in CSS px. The root is width 100%, so it is the container's width. */
  _measure() {
    if (!this._isCompact()) return;
    var el = this._root || (this._rid ? document.getElementById(this._rid) : null);
    if (!el) return;
    var w = el.clientWidth || 0;
    var up = el.parentElement, tries = 0, cs;
    /* a root with no width yet: use the nearest ancestor that has one, less its padding */
    while (w < 40 && up && tries < 8) {
      w = up.clientWidth || 0;
      if (w >= 40 && window.getComputedStyle) {
        cs = window.getComputedStyle(up);
        w -= (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
      }
      up = up.parentElement;
      tries += 1;
    }
    w = Math.floor(w);
    if (w < 40) return;
    var s = this.state || {};
    if (s.cw !== w) this.setState({ cw: w });
  }

  /* Everything a resting frame depends on. */
  _sig() {
    var el = this._el || (this._cid ? document.getElementById(this._cid) : null);
    if (!el) return '';
    this._model();
    return [this._mKey, this._sel, el.clientWidth, el.clientHeight, this._tPlay, this._selAt, window.devicePixelRatio || 1].join('|');
  }

  _split(v, fallback, sep) {
    var raw = String(v === undefined || v === null || v === '' ? fallback : v).split(sep), out = [];
    for (var i = 0; i < raw.length; i++) out.push(raw[i].replace(/^\s+|\s+$/g, ''));
    return out;
  }

  /* "5,6,9" -> ["5","6","9"]; "", "none" or anything without whole numbers -> [] */
  _ints(v, fallback) {
    var raw = this._split(v, fallback, ','), out = [];
    for (var i = 0; i < raw.length; i++) {
      if (/^\d+$/.test(raw[i])) out.push(String(parseInt(raw[i], 10)));
    }
    return out;
  }

  /* a comma list of state names; "" and "none" mean an empty list */
  _words(v, fallback) {
    var raw = this._split(v, fallback, ','), out = [];
    for (var i = 0; i < raw.length; i++) {
      if (raw[i] && raw[i] !== 'none') out.push(raw[i]);
    }
    return out;
  }

  _text(v, fallback) {
    return (v === undefined || v === null || v === '') ? fallback : String(v);
  }

  _rgb(hex) {
    var h = String(hex).replace('#', '');
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
  }

  _mix(a, b, k) {
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * k) + ',' + Math.round(a[1] + (b[1] - a[1]) * k) + ',' + Math.round(a[2] + (b[2] - a[2]) * k) + ')';
  }

  /* 248 -> "4m 08s", 3720 -> "1h 02m", 266400 -> "3d 2h" */
  _fmt(sec) {
    sec = Math.round(sec);
    if (sec < 60) return sec + 's';
    if (sec >= 86400) return Math.floor(sec / 86400) + 'd ' + Math.floor((sec % 86400) / 3600) + 'h';
    var m = Math.floor(sec / 60), s = sec % 60;
    if (sec < 3600) return (s && m < 10) ? m + 'm ' + (s < 10 ? '0' : '') + s + 's' : m + 'm';
    var h = Math.floor(m / 60);
    m = m % 60;
    return h + 'h ' + (m < 10 ? '0' : '') + m + 'm';
  }

  _bayer() {
    if (this._bay) return this._bay;
    var m = [0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26,
      12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22,
      3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25,
      15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21];
    var out = [];
    for (var i = 0; i < 64; i++) out.push((m[i] + 0.5) / 64);
    this._bay = out;
    return out;
  }

  /* Sample data used when a prop is not passed: one ticket per mode, from the R2 data sheet. */
  _sample(ended) {
    if (ended === 'shipped') {
      /* factory#470: merged at 7:56 AM, 12 hops, 1h 52m from intake to merge */
      return {
        path: 'intake,planning,plan-check,building,review,fixing,review,fixing,review,fixing,review,merge-queue,merged',
        who: 'script,claude,codex,claude,codex,claude,codex,claude,codex,claude,codex,script,script',
        durs: '20,260,130,1480,400,760,350,640,330,520,310,1500,20',
        notes: 'ticket arrives|no open questions, plan queued|trusted builder posts kind=plan|every acceptance criterion mapped|ready, CI green|REVISE, under the round cap|ready, CI green|REVISE, under the round cap|ready, CI green|REVISE, under the round cap|ready, CI green|approved, waiting to merge|merged by the poller',
        jumps: '',
        future: '',
        start: '6:04 AM',
        end: '7:56 AM'
      };
    }
    if (ended === 'stopped') {
      /* cleffy#103: stuck in planning for 3d 2h, stopped Fri Nov 13 at 8:05 AM */
      return {
        path: 'intake,questions,planning',
        who: 'script,script,claude',
        durs: '20,180,266400',
        notes: 'ticket arrives|brief and acceptance criteria posted|cancelled: superseded by sanctioned intake (Factory 2026-11-13)',
        jumps: '',
        future: '',
        start: '',
        end: 'Fri 8:05 AM'
      };
    }
    /* factory#474: fixing, round 2 of 3, started 9:03 AM */
    return {
      path: 'intake,planning,plan-check,building,review,fixing,review,fixing',
      who: 'script,claude,codex,claude,codex,claude,codex,claude',
      durs: '20,250,125,1110,372,580,302,665',
      notes: 'ticket arrives|no open questions, plan queued|trusted builder posts kind=plan|every acceptance criterion mapped|ready, CI green|REVISE, under the round cap|ready, CI green|REVISE, under the round cap',
      jumps: '',
      future: 'review,merge-queue,merged',
      start: '9:03 AM',
      end: '10:10 AM'
    };
  }

  /* Where things sit, in cells. Wide is the JourneyClimb grid; compact is sized from the measured width. */
  _geom(compact) {
    var s = this.state || {};
    var gw = 250;

    } else if (n && shipped && !arrived) {
      /* during the one draw-in of a shipped journey the marker is green, and it is gone at the flag */
      ctx.fillStyle = '#d6efbf';
      block(tokenX, tokenY + BO - 1, 2, BH + 2);
    }

    /* at rest: nothing on this frame will change by itself, so the loop can stop redrawing it */
    var resting = arrived && !flashing && (still || (shipped && st >= 1));
    this._restSig = resting ? this._sig() : null;
  }
}
</script>
</body>

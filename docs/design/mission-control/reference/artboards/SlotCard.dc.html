<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slot card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; box-sizing: border-box; width: 100%; background: #16161e; border: 1px {{ borderStyle }} {{ borderColor }}; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.3; color: #c0caf5">
<sc-if value="{{ isHeld }}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; inset: -1px; pointer-events: none">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 2px; background-image: repeating-linear-gradient(90deg, #ff9e64 0 8px, transparent 8px 16px); background-position: {{ marchPos }} 0"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background-image: repeating-linear-gradient(90deg, #ff9e64 0 8px, transparent 8px 16px); background-position: {{ marchNeg }} 0"></div>
<div style="position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background-image: repeating-linear-gradient(180deg, #ff9e64 0 8px, transparent 8px 16px); background-position: 0 {{ marchPos }}"></div>
<div style="position: absolute; top: 0; bottom: 0; left: 0; width: 2px; background-image: repeating-linear-gradient(180deg, #ff9e64 0 8px, transparent 8px 16px); background-position: 0 {{ marchNeg }}"></div>
</div>
</sc-if>
<dc-import name="PixelStrip" effect="{{ effect }}" tint="{{ stripTint }}" tint-mix="{{ tintMix }}" progress="{{ progress }}" cell="{{ cell }}" still="{{ still }}" seed="{{ seed }}" beat="{{ beat }}" done="{{ done }}" strip-height="24" hint-size="100%,24px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px; min-height: 105px; box-sizing: border-box">
<sc-if value="{{ isJob }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.08em; padding: 2px 6px; border: 1px solid {{ botTint }}; color: {{ botTint }}">{{ botLabel }}</span>
<span style="color: #c0caf5; white-space: nowrap">{{ label }}</span>
<span style="flex-grow: 1"></span>
<span style="font-size: 10px; letter-spacing: 0.06em; padding: 2px 6px; white-space: nowrap; border: 1px solid {{ stateColor }}; color: {{ stateColor }}">{{ stateLabel }}</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; min-height: 20px">
<sc-if value="{{ showGlyph }}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="display: grid; grid-template-columns: 5px 5px; grid-template-rows: 5px 5px; gap: 1px"><span style="background: {{ g0 }}"></span><span style="background: {{ g1 }}"></span><span style="background: {{ g2 }}"></span><span style="background: {{ g3 }}"></span></span>
</sc-if>
<span role="img" aria-label="{{ text }}" style="display: flex; white-space: pre; font-size: 14px; font-weight: 500"><sc-for list="{{ letters }}" as="ch" hint-placeholder-count="8"><span style="color: {{ ch.color }}">{{ ch.c }}</span></sc-for></span>
<sc-if value="{{ showTag }}" hint-placeholder-val="{{ true }}">
<span style="font-size: 10px; letter-spacing: 0.08em; padding: 1px 5px; border: 1px solid #414868; color: #8d95bd">{{ actionTag }}</span>
</sc-if>
<span style="flex-grow: 1"></span>
<sc-if value="{{ isDead }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em; padding: 2px 6px; background: #f7768e; border: 1px solid #f7768e; color: #16161e">OVERDUE</span>
</sc-if>
<span style="color: #8d95bd; white-space: nowrap">{{ roundText }}</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; color: #8d95bd">
<span>{{ elapsedText }}</span>
<span style="flex-grow: 1"></span>
<span style="color: {{ hbColor }}">{{ hbText }}</span>
</div>
<div aria-hidden="true" style="height: 4px; background: #292e42"><div style="height: 4px; width: {{ hbPct }}; background: {{ hbColor }}"></div></div>
</div>
</sc-if>
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 10px; letter-spacing: 0.06em; padding: 2px 6px; border: 1px solid {{ stateColor }}; color: {{ stateColor }}">{{ stateLabel }}</span>
<span style="color: #8d95bd">{{ emptyText }}</span>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["plan","build","review","fix","claimed","stale","dead","idle","held"],"default":"build","section":"State"},"bot":{"editor":"enum","options":["claude","codex","cursor"],"default":"claude","section":"State"},"progress":{"editor":"range","min":0,"max":1,"step":0.01,"default":0.6,"section":"State"},"done":{"editor":"boolean","default":false,"section":"State"},"cell":{"editor":"int","min":2,"max":8,"default":4,"unit":"px","section":"Pixel grid"},"tintMix":{"editor":"range","min":0,"max":1,"step":0.05,"default":1,"section":"Pixel grid"},"verbs":{"editor":"boolean","default":true,"section":"Motion"},"still":{"editor":"boolean","default":false,"section":"Motion"},"label":{"editor":null,"default":"#482 · T-1193"},"seed":{"editor":null,"default":1},"beat":{"editor":null,"default":0},"$preview":{"width":344,"height":132}}'>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    this._sysStill = !!(mq && mq.matches);
    /* 8 Hz tick drives the glyph, the letter shimmer, the verb and the held border */
    this._iv = window.setInterval(function () {
      if (!self._moving) return;
      var tick = (self.state && self.state.tick) || 0;
      self.setState({ tick: tick + 1 });
    }, 125);
  }

  componentWillUnmount() {
    if (this._iv) window.clearInterval(this._iv);
  }

  _n(v, d) {
    if (v === null || v === undefined || v === '') return d;
    var n = Number(v);
    return isFinite(n) ? n : d;
  }

  _fmt(minutes) {
    var s = Math.round(minutes * 60);
    var mm = Math.floor(s / 60), ss = s % 60;
    return (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
  }

  renderVals() {
    var p = this.props;
    var mode = String(p.mode || 'build');
    var tick = (this.state && this.state.tick) || 0;
    var still = p.still === true || p.still === 'true' || !!this._sysStill;
    var done = p.done === true || p.done === 'true';
    var verbsOn = !(p.verbs === false || p.verbs === 'false');
    var seed = this._n(p.seed, 1);
    var progress = Math.max(0, Math.min(1, this._n(p.progress, 0.6)));

    var bots = {
      claude: ['CLAUDE', '#e0af68'],
      codex: ['CODEX', '#7aa2f7'],
      cursor: ['CURSOR', '#bb9af7']
    };
    var bot = bots[String(p.bot || 'claude')] || bots.claude;
    var botTint = bot[1];

    var running = mode === 'plan' || mode === 'build' || mode === 'review' || mode === 'fix';
    var isJob = running || mode === 'claimed' || mode === 'stale' || mode === 'dead';
    var live = running && !done;
    /* motion rule: only active work moves */
    this._moving = !still && (live || mode === 'held');

    var elapsed = tick / 8 + seed * 1.3;

    var effects = {
      plan: 'field', build: 'fill', review: 'scan', fix: 'patch',
      claimed: 'spin3', stale: 'decay', dead: 'static', idle: 'twinkle', held: 'off'
    };
    var stripTint = mode === 'dead' ? '#f7768e' : mode === 'idle' ? '#9ece6a' : botTint;

    var stateLabel = 'running', stateColor = '#9ece6a';
    if (done) stateLabel = 'done';
    else if (mode === 'claimed') { stateLabel = 'claimed'; stateColor = '#ff9e64'; }
    else if (mode === 'stale') { stateLabel = 'stale heartbeat'; stateColor = '#ff9e64'; }
    else if (mode === 'dead') { stateLabel = 'runner dead'; stateColor = '#f7768e'; }
    else if (mode === 'idle') { stateLabel = 'idle'; stateColor = '#8d95bd'; }
    else if (mode === 'held') { stateLabel = 'held'; stateColor = '#ff9e64'; }

    var verbs = {
      plan: ['Pondering', 'Sketching', 'Scheming'],
      build: ['Assembling', 'Stacking', 'Forging'],
      review: ['Scrutinizing', 'Combing', 'Squinting'],
      fix: ['Patching', 'Mending', 'Tinkering']
    };
    var text = 'build', textColor = '#8d95bd', shimmer = false;
    if (done) {
      text = 'Done';
      textColor = '#9ece6a';
    } else if (running) {
      var list = verbs[mode];
      text = verbsOn ? list[Math.floor(elapsed / 4) % list.length] + '…' : mode;
      textColor = '#c0caf5';
      shimmer = !still;
    } else if (mode === 'claimed') {
      text = 'Waiting to start';
    }

    /* Codex-style sweep, one letter per tick */
    var letters = [];
    var pos = shimmer ? (tick % (text.length + 10)) - 2 : -99;
    for (var i = 0; i < text.length; i++) {
      var dist = Math.abs(i - pos);
      letters.push({ c: text.charAt(i), color: dist === 0 ? '#ffffff' : dist === 1 ? botTint : textColor });
    }

    /* 2x2 block glyph, one quadrant lit, stepping at 4 Hz */
    var order = [2, 0, 1, 3];
    var litCell = live ? (still ? 2 : order[Math.floor(tick / 2) % 4]) : -1;
    var g = [];
    for (var q = 0; q < 4; q++) g.push(q === litCell ? botTint : '#292e42');

    var elapsedText = '';
    if (mode === 'build') elapsedText = 'T+ ' + this._fmt(progress * 30) + ' / 30:00';
    else if (mode === 'plan') elapsedText = 'T+ 04:12 / 20:00';
    else if (mode === 'review') elapsedText = 'T+ 07:48 / 15:00';
    else if (mode === 'fix') elapsedText = 'T+ 03:05 / 20:00';
    else if (mode === 'claimed') elapsedText = 'T+ 00:07';
    else if (mode === 'stale') elapsedText = 'T+ 22:31 / 30:00';
    else if (mode === 'dead') elapsedText = 'T+ 41:12 / 30:00';

    /* heartbeat: a beat every 5 s in this mock; each one fires the strip ripple */
    var beatN = Math.floor(elapsed / 5);
    var hbText = 'hb —', hbPct = '0%', hbColor = '#8d95bd';
    if (done) {
      hbText = 'hb ok'; hbPct = '100%'; hbColor = '#9ece6a';
    } else if (live) {
      var age = Math.floor(elapsed % 5);
      hbText = 'hb ' + age + 's'; hbPct = (100 - age * 14) + '%'; hbColor = '#9ece6a';
    } else if (mode === 'stale') {
      hbText = 'hb 94s'; hbPct = '34%'; hbColor = '#ff9e64';
    } else if (mode === 'dead') {
      hbText = 'hb 6m'; hbPct = '100%'; hbColor = '#f7768e';
    }

    var march = (Math.floor(tick / 4) * 4) % 16;

    return {
      isJob: isJob,
      isEmpty: !isJob,
      isHeld: mode === 'held',
      isDead: mode === 'dead',
      borderStyle: mode === 'idle' ? 'dashed' : 'solid',
      borderColor: mode === 'dead' ? '#f7768e' : mode === 'idle' ? '#414868' : mode === 'held' ? 'transparent' : '#292e42',
      marchPos: march + 'px',
      marchNeg: (0 - march) + 'px',
      effect: effects[mode] || 'off',
      stripTint: stripTint,
      tintMix: this._n(p.tintMix, 1),
      progress: progress,
      cell: this._n(p.cell, 4),
      still: still,
      seed: seed,
      beat: beatN + this._n(p.beat, 0),
      done: done,
      botLabel: bot[0],
      botTint: botTint,
      label: p.label == null ? '#482 · T-1193' : String(p.label),
      stateLabel: stateLabel,
      stateColor: stateColor,
      showGlyph: (running || mode === 'stale') && !done,
      g0: g[0], g1: g[1], g2: g[2], g3: g[3],
      text: text,
      letters: letters,
      showTag: running && verbsOn && !done,
      actionTag: mode.toUpperCase(),
      roundText: (isJob && mode !== 'claimed' && mode !== 'dead') ? 'round ' + (1 + (seed % 3)) : '',
      elapsedText: elapsedText,
      hbText: hbText,
      hbPct: hbPct,
      hbColor: hbColor,
      emptyText: mode === 'held' ? 'reserved · T-1207' : 'free slot'
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>State map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="{{ summary }}" style="position: relative; width: 1000px; height: 352px; background: #0e0e14; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace">
<canvas id="{{ cid }}" ref="{{ setCanvas }}" aria-hidden="true" style="display: block; width: 1000px; height: 352px; background: #0e0e14"></canvas>
<sc-for list="{{ heads }}" as="h" hint-placeholder-count="5"><div aria-hidden="true" style="position: absolute; left: {{ h.left }}; top: 10px; width: {{ h.width }}; text-align: center; font-size: 11px; line-height: 1.3; letter-spacing: 0.08em; text-transform: uppercase; color: #8b93b8">{{ h.label }}</div></sc-for>
<sc-for list="{{ labels }}" as="n" hint-placeholder-count="20"><div aria-hidden="true" style="position: absolute; left: {{ n.left }}; top: {{ n.top }}; width: 136px; height: {{ n.height }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center; pointer-events: none"><span style="font-size: 11px; line-height: 1.1; font-weight: 500; color: {{ n.color }}">{{ n.name }}</span><span style="font-size: 9px; line-height: 1.1; color: #8b93b8">{{ n.gloss }}</span></div></sc-for>
<sc-for list="{{ counts }}" as="k" hint-placeholder-count="2"><div aria-hidden="true" style="position: absolute; left: {{ k.left }}; top: {{ k.top }}; padding: 0 4px; background: #7dcfff; color: #0c0e10; font-size: 10px; line-height: 14px; font-weight: 700">{{ k.label }}</div></sc-for>
<sc-for list="{{ hops }}" as="hop" hint-placeholder-count="9"><div aria-hidden="true" style="position: absolute; left: {{ hop.left }}; top: {{ hop.top }}; width: 14px; height: 14px; box-sizing: border-box; border: 1px solid {{ hop.color }}; background: #0e0e14; color: {{ hop.color }}; font-size: 9px; line-height: 12px; font-weight: 700; text-align: center">{{ hop.label }}</div></sc-for>
<div aria-hidden="true" style="position: absolute; left: 700px; top: 314px; font-size: 11px; line-height: 1.3; letter-spacing: 0.08em; text-transform: uppercase; color: #8b93b8">stop states</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"path":{"editor":"text","default":"intake,questions,planning,plan-check,building,planning,review,fixing,stuck,fixing","section":"Run"},"tint":{"editor":"color","default":"#e0af68","options":["#e0af68","#7aa2f7","#bb9af7","#73daca"],"section":"Run"},"allEdges":{"editor":"boolean","default":false,"section":"Map"},"still":{"editor":"boolean","default":false,"section":"Map"},"$preview":{"width":1000,"height":352}}'>
class Component extends DCLogic {
  /*
   * FlowMap: the 20-state chart on a 250 x 88 cell grid (4 px cells).
   * Nodes sit in phase columns; only the edges that matter are drawn:
   * the path taken (lit, with a pulse running toward "now"), off-chart
   * jumps (dotted) and what can come next (dashed). Wires are routed
   * through column gutters and row channels, so they never cross a node.
   */
  renderVals() {
    var self = this;
    if (!this._setCanvas) {
      this._cid = 'fm-' + Math.random().toString(36).slice(2, 10);
      this._setCanvas = function (el) {
        self._el = el || null;
        self._ctx = null;
      };
    }
    var m = this._model();
    return {
      cid: this._cid,
      setCanvas: this._setCanvas,
      labels: m.labels,
      counts: m.counts,
      hops: m.hops,
      heads: m.heads,
      summary: m.summary
    };
  }

  componentDidMount() {
    var self = this;
    this._dead = false;
    this._t0 = performance.now();
    this._last = 0;
    var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    this._sysStill = !!(mq && mq.matches);
    var loop = function (now) {
      if (self._dead) return;
      self._raf = window.requestAnimationFrame(loop);
      if (now - self._last < 47) return;
      self._last = now;
      try { self._draw(now); } catch (e) { self._dead = true; }
    };
    try { this._draw(performance.now()); } catch (e) { this._dead = true; }
    this._raf = window.requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    this._dead = true;
    if (this._raf) window.cancelAnimationFrame(this._raf);
  }

  _defs() {
    /* name, column, row, gloss, end state */
    return [
      ['intake', 0, 0, 'ticket', 0], ['questions', 0, 1, '', 0], ['waiting-max', 0, 2, '', 0],
      ['planning', 1, 0, '', 0], ['plan-check', 1, 1, '', 0],
      ['building', 2, 0, '', 0], ['fixing', 2, 1, 'revise', 0],
      ['review', 3, 0, '', 0], ['capped', 3, 1, '', 0],
      ['ship', 4, 0, '', 0], ['awaiting-ok', 4, 1, 'human OK', 0], ['waiting-external', 4, 2, '', 0],
      ['merged', 5, 0, '', 0], ['post-merge', 5, 1, '', 0], ['done', 5, 2, 'shipped', 1], ['handed-off', 5, 3, 'ready for review', 1],
      ['refused', 0, 4, '', 1], ['abandoned', 1, 4, '', 1], ['stuck', 2, 4, '', 1], ['blocked', 3, 4, '', 1]
    ];
  }

  _edges() {
    return ('intake>refused intake>questions questions>building questions>planning questions>waiting-max ' +
      'building>waiting-max building>review building>stuck planning>plan-check planning>stuck ' +
      'waiting-max>questions waiting-max>abandoned waiting-max>building plan-check>building plan-check>planning ' +
      'review>blocked review>ship review>stuck review>fixing ship>review ship>awaiting-ok ship>handed-off ' +
      'ship>merged ship>waiting-external fixing>waiting-max fixing>review fixing>stuck waiting-max>fixing ' +
      'awaiting-ok>review awaiting-ok>merged awaiting-ok>fixing merged>done merged>post-merge ' +
      'waiting-external>merged waiting-external>fixing plan-check>stuck post-merge>done review>capped ' +
      'capped>fixing awaiting-ok>capped waiting-external>stuck').split(' ');
  }

  _colX(c) {
    return 3 + c * 42;
  }

  _rowY(r) {
    return r >= 4 ? 76 : 9 + r * 16;
  }

  /* Corner points of an orthogonal wire from node a to node b, in cells. */
  _route(a, b, nodes) {
    var NW = 34, NH = 9;
    var ax = a.x, ay0 = a.y, bx = b.x, by0 = b.y;
    var g1, g2, ch, ay, by, x, k, lo, hi, blocked;
    if (a.c === b.c) {
      lo = Math.min(a.r, b.r);
      hi = Math.max(a.r, b.r);
      blocked = false;
      for (k = 0; k < nodes.length; k++) {
        if (nodes[k].c === a.c && nodes[k].r > lo && nodes[k].r < hi) blocked = true;
      }
      if (!blocked) {
        if (b.r > a.r) {
          x = ax + 14;
          return [[x, ay0 + NH], [x, by0 - 1]];
        }
        x = ax + 20;
        return [[x, ay0 - 1], [x, by0 + NH]];
      }
      g1 = Math.min(248, ax + 36);
      return [[ax + NW, ay0 + 2], [g1, ay0 + 2], [g1, by0 + 6], [bx + NW, by0 + 6]];
    }
    if (b.c > a.c) {
      ay = ay0 + 2;
      by = by0 + 2;
      g1 = ax + 36;
      if (b.c === a.c + 1) return [[ax + NW, ay], [g1, ay], [g1, by], [bx - 1, by]];
      ch = (b.r >= a.r && a.r < 4) ? ay0 + 11 : this._rowY(a.r - 1) + 11;
      g2 = this._colX(b.c - 1) + 36;
      return [[ax + NW, ay], [g1, ay], [g1, ch], [g2, ch], [g2, by], [bx - 1, by]];
    }
    ay = ay0 + 6;
    by = by0 + 6;
    g1 = this._colX(a.c - 1) + 39;
    if (b.c === a.c - 1) return [[ax - 1, ay], [g1, ay], [g1, by], [bx + NW, by]];
    ch = (b.r >= a.r && a.r < 4) ? ay0 + 14 : this._rowY(a.r - 1) + 14;
    g2 = this._colX(b.c) + 39;
    return [[ax - 1, ay], [g1, ay], [g1, ch], [g2, ch], [g2, by], [bx + NW, by]];
  }

  /* Every cell along a list of corner points. */
  _cells(pts) {
    var out = [], i, x = pts[0][0], y = pts[0][1], tx, ty;
    out.push([x, y]);
    for (i = 1; i < pts.length; i++) {
      tx = pts[i][0];
      ty = pts[i][1];
      while (x !== tx || y !== ty) {
        if (x !== tx) x += tx > x ? 1 : -1;
        else y += ty > y ? 1 : -1;
        out.push([x, y]);
      }
    }
    return out;
  }

  /* The two flare cells that make an arrowhead at the end of a wire. */
  _head(cells) {
    var n = cells.length;
    if (n < 2) return [];
    var lx = cells[n - 1][0], ly = cells[n - 1][1];
    var dx = lx - cells[n - 2][0], dy = ly - cells[n - 2][1];
    return [[lx - dx + dy, ly - dy + dx], [lx - dx - dy, ly - dy - dx]];
  }

  _model() {
    var p = this.props;
    var pathStr = String(p.path || 'intake,questions,planning,plan-check,building,planning,review,fixing,stuck,fixing');
    var all = p.allEdges === true || p.allEdges === 'true';
    var whoStr = String(p.who || 'script,script,claude,script,claude,claude,codex,claude,grok,claude');
    var key = pathStr + '|' + whoStr + '|' + all;
    if (this._m && this._mKey === key) return this._m;

    var NW = 34, NH = 9;
    var defs = this._defs(), nodes = [], byName = {}, i, j, n;
    for (i = 0; i < defs.length; i++) {
      n = {
        name: defs[i][0], c: defs[i][1], r: defs[i][2], gloss: defs[i][3], end: defs[i][4] === 1,
        x: this._colX(defs[i][1]), y: this._rowY(defs[i][2]),
        visits: 0, current: false, next: false, perim: []
      };
      /* perimeter cells, clockwise from the top-left corner */
      for (j = 0; j < NW; j++) n.perim.push([n.x + j, n.y]);
      for (j = 1; j < NH; j++) n.perim.push([n.x + NW - 1, n.y + j]);
      for (j = NW - 2; j >= 0; j--) n.perim.push([n.x + j, n.y + NH - 1]);
      for (j = NH - 2; j >= 1; j--) n.perim.push([n.x, n.y + j]);
      nodes.push(n);
      byName[n.name] = n;
    }

    var raw = pathStr.split(','), whoRaw = whoStr.split(','), path = [], whoList = [], name;
    var tints = { script: '#a9b1d6', claude: '#e0af68', codex: '#7aa2f7', cursor: '#bb9af7', grok: '#73daca', human: '#ff9e64' };
    for (i = 0; i < raw.length; i++) {
      name = raw[i].replace(/^\s+|\s+$/g, '');
      if (byName[name]) {
        path.push(name);
        whoList.push(tints[String(whoRaw[i] || '').replace(/^\s+|\s+$/g, '')] || tints.script);
      }
    }
    for (i = 0; i < path.length; i++) byName[path[i]].visits += 1;
    var cur = path.length ? byName[path[path.length - 1]] : null;
    if (cur) cur.current = true;

    var edgeList = this._edges(), edgeSet = {}, taken = {};
    for (i = 0; i < edgeList.length; i++) edgeSet[edgeList[i]] = true;

    /* path taken: one continuous run of cells, hop after hop */
    /* each hop is coloured by who did the step it leads to; a fall to a stop state is red */
    var wire = [], heads = [], hops = [], cols = [], a, b, cells, jump, id, hex, rgb, mid;
    for (i = 1; i < path.length; i++) {
      a = byName[path[i - 1]];
      b = byName[path[i]];
      if (a === b) continue;
      id = a.name + '>' + b.name;
      jump = !edgeSet[id];
      taken[id] = true;
      cells = this._cells(this._route(a, b, nodes));
      hex = b.r >= 4 ? '#f7768e' : whoList[i];
      rgb = this._hex(hex);
      cols.push({
        lit: hex,
        mid: 'rgb(' + Math.round(14 + (rgb[0] - 14) * 0.66) + ',' + Math.round(14 + (rgb[1] - 14) * 0.66) + ',' + Math.round(20 + (rgb[2] - 20) * 0.66) + ')',
        crest: 'rgb(' + Math.round(rgb[0] + (255 - rgb[0]) * 0.5) + ',' + Math.round(rgb[1] + (255 - rgb[1]) * 0.5) + ',' + Math.round(rgb[2] + (255 - rgb[2]) * 0.5) + ')'
      });
      for (j = 0; j < cells.length; j++) wire.push([cells[j][0], cells[j][1], jump ? 1 : 0, j, cols.length - 1]);
      heads.push(this._head(cells));
      mid = cells[Math.floor(cells.length / 2)];
      hops.push({ label: String(hops.length + 1), left: (mid[0] * 4 - 5) + 'px', top: (mid[1] * 4 - 5) + 'px', color: hex });
    }

    /* what can come next: every edge out of the current state */
    var nextWires = [], dimWires = [], parts, from, to;
    for (i = 0; i < edgeList.length; i++) {
      parts = edgeList[i].split('>');
      from = byName[parts[0]];
      to = byName[parts[1]];
      if (!from || !to || from === to) continue;
      if (cur && from === cur) {
        to.next = true;
        if (!taken[edgeList[i]]) {
          cells = this._cells(this._route(from, to, nodes));
          nextWires.push({ cells: cells, head: this._head(cells) });
        }
      } else if (all && !taken[edgeList[i]]) {
        dimWires.push(this._cells(this._route(from, to, nodes)));
      }
    }

    var labels = [], counts = [], nextNames = [];
    for (i = 0; i < nodes.length; i++) {
      n = nodes[i];
      labels.push({
        name: n.name,
        gloss: n.gloss,
        left: (n.x * 4) + 'px',
        top: (n.y * 4) + 'px',
        height: (n.current ? 26 : 36) + 'px',
        color: n.current ? '#7dcfff' : n.visits > 0 ? '#c0caf5' : n.next ? '#a9b1d6' : '#8b93b8'
      });
      if (n.visits > 1) counts.push({ label: '×' + n.visits, left: ((n.x + NW) * 4 - 26) + 'px', top: (n.y * 4 - 7) + 'px' });
      if (n.next) nextNames.push(n.name);
    }

    var phases = [['Ask', 0, 1], ['Plan', 1, 1], ['Build', 2, 1], ['Review', 3, 1], ['Ship', 4, 2]];
    var headLabels = [];
    for (i = 0; i < phases.length; i++) {
      headLabels.push({
        label: phases[i][0],
        left: (this._colX(phases[i][1]) * 4) + 'px',
        width: ((phases[i][2] * 42 - 8) * 4) + 'px'
      });
    }

    this._mKey = key;
    this._m = {
      nodes: nodes, wire: wire, heads: heads, nextWires: nextWires, dimWires: dimWires,
      labels: labels, counts: counts, hops: hops, cols: cols, heads2: headLabels,
      summary: 'State map. Path taken: ' + path.join(', ') + '. Now: ' + (cur ? cur.name : 'none') + '. Can come next: ' + nextNames.join(', ') + '.'
    };
    this._m.headCells = heads;
    this._m.heads = headLabels;
    return this._m;
  }

  _hex(s) {
    var m = /^#?([0-9a-f]{6})/i.exec(String(s || '').replace(/^\s+/, ''));
    if (!m) return [224, 175, 104];
    return [parseInt(m[1].substr(0, 2), 16), parseInt(m[1].substr(2, 2), 16), parseInt(m[1].substr(4, 2), 16)];
  }

  _draw(now) {
    var el = this._el || (this._cid ? document.getElementById(this._cid) : null);
    if (!el || !el.getContext) return;
    var cssW = el.clientWidth, cssH = el.clientHeight;
    if (!cssW || !cssH) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var W = Math.round(cssW * dpr), H = Math.round(cssH * dpr);
    if (el.width !== W || el.height !== H) {
      el.width = W;
      el.height = H;
    }
    var ctx = this._ctx || (this._ctx = el.getContext('2d'));
    if (!ctx) return;

    var p = this.props;
    var still = p.still === true || p.still === 'true' || this._sysStill;
    var t = still ? 0 : (now - this._t0) / 1000;
    var m = this._model();
    var px = (cssW / 250) * dpr;
    var size = Math.ceil(px);
    var NW = 34, NH = 9;
    var put = function (x, y) {
      ctx.fillRect(Math.round(x * px), Math.round(y * px), size, size);
    };
    var i, j, k, n, c, d, w;

    var tintRgb = this._hex(p.tint);
    var tint = 'rgb(' + tintRgb[0] + ',' + tintRgb[1] + ',' + tintRgb[2] + ')';
    var tintDim = 'rgb(' + Math.round(14 + (tintRgb[0] - 14) * 0.3) + ',' + Math.round(14 + (tintRgb[1] - 14) * 0.3) + ',' + Math.round(20 + (tintRgb[2] - 20) * 0.3) + ')';
    var MID = '#5386a6', LIT = '#7dcfff', CREST = '#b8e5ff';

    ctx.fillStyle = '#0e0e14';
    ctx.fillRect(0, 0, W, H);

    /* rail above the stop states */
    ctx.fillStyle = '#24283b';
    for (i = 3; i < 247; i += 2) put(i, 72);

    /* every other transition, very dim (optional) */
    ctx.fillStyle = '#23263a';
    for (i = 0; i < m.dimWires.length; i++) {
      w = m.dimWires[i];
      for (j = 0; j < w.length; j += 2) put(w[j][0], w[j][1]);
    }

    /* can come next: dashed */
    ctx.fillStyle = '#6b7399';
    for (i = 0; i < m.nextWires.length; i++) {
      w = m.nextWires[i].cells;
      for (j = 0; j < w.length; j++) {
        if (j % 3 !== 2) put(w[j][0], w[j][1]);
      }
      w = m.nextWires[i].head;
      for (j = 0; j < w.length; j++) put(w[j][0], w[j][1]);
    }

    /* path taken, with a pulse running toward "now" */
    var total = m.wire.length;
    var head = still ? -99 : (t * 30) % (total + 45);
    for (i = 0; i < total; i++) {
      c = m.wire[i];
      if (c[2] === 1 && c[3] % 3 === 2) continue;
      ctx.fillStyle = m.cols[c[4]].mid;
      put(c[0], c[1]);
    }
    if (!still) {
      for (i = 0; i < total; i++) {
        c = m.wire[i];
        d = head - i;
        if (d < 0 || d >= 14) continue;
        if (c[2] === 1 && c[3] % 3 === 2) continue;
        ctx.fillStyle = d < 4 ? m.cols[c[4]].crest : m.cols[c[4]].lit;
        put(c[0], c[1]);
      }
    }
    for (i = 0; i < m.headCells.length; i++) {
      w = m.headCells[i];
      ctx.fillStyle = m.cols[i].lit;
      for (j = 0; j < w.length; j++) put(w[j][0], w[j][1]);
    }

    /* nodes */
    var march = Math.floor(t * 14);
    var band = Math.floor(t * 10);
    for (i = 0; i < m.nodes.length; i++) {
      n = m.nodes[i];
      ctx.fillStyle = n.current ? '#292e42' : n.visits > 0 ? '#16222d' : '#13141c';
      ctx.fillRect(Math.round((n.x + 1) * px), Math.round((n.y + 1) * px), Math.ceil((NW - 2) * px), Math.ceil((NH - 2) * px));

      var edge = n.current ? LIT : n.visits > 0 ? MID : n.next ? '#8b93b8' : '#343a55';
      var dashed = !n.current && n.visits === 0 && n.next;
      ctx.fillStyle = edge;
      for (j = 0; j < n.perim.length; j++) {
        if (dashed && j % 2 === 1) continue;
        put(n.perim[j][0], n.perim[j][1]);
      }
      if (n.end) {
        put(n.x + 1, n.y + 1);
        put(n.x + NW - 2, n.y + 1);
        put(n.x + 1, n.y + NH - 2);
        put(n.x + NW - 2, n.y + NH - 2);
      }
      if (n.current) {
        if (!still) {
          ctx.fillStyle = CREST;
          for (j = 0; j < 8; j++) {
            k = (((march - j) % n.perim.length) + n.perim.length) % n.perim.length;
            put(n.perim[k][0], n.perim[k][1]);
          }
        }
        /* the work pattern of the running step, in the bot's colour */
        for (j = 1; j < NW - 1; j++) {
          k = (((j - band) % 12) + 12) % 12;
          ctx.fillStyle = k < 3 ? tint : tintDim;
          put(n.x + j, n.y + NH - 3);
          put(n.x + j, n.y + NH - 2);
        }
      }
    }
  }
}
</script>
</body>
</html>

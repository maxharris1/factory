<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Header band at three loads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#8d95bd;text-decoration:none}a:hover{color:#c0caf5}
</style>
</helmet>
<div style="width: 1280px; height: 470px; box-sizing: border-box; padding: 40px; background: #1a1b26; color: #c0caf5; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-size: 20px; font-weight: 600; color: #c0caf5">Header band — brightness tracks running / total slots</h1>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8d95bd">Low load</div>
<div style="background: #16161e; border: 1px solid #292e42; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace">
<div style="display: flex; align-items: center; gap: 24px; height: 44px; padding: 0 16px">
<div style="display: flex; align-items: center; gap: 5px">
<span style="font-size: 15px; font-weight: 700; color: #9ece6a">factory</span>
<span aria-hidden="true" style="display: block; width: 8px"><dc-import name="PixelStrip" effect="caret" tint="#9ece6a" rate="1" cell="4" strip-height="12" still="{{ still }}" hint-size="8px,12px"></dc-import></span>
</div>
<nav style="display: flex; gap: 20px; font-size: 12px">
<a href="#status">status</a>
<a href="#lanes">lanes</a>
<a href="#jobs">jobs</a>
<a href="#log">log</a>
</nav>
<span style="flex-grow: 1"></span>
<span style="font-size: 12px; color: #8d95bd">2 / 12 slots running</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9ece6a"><span aria-hidden="true" style="width: 8px; height: 8px; background: #9ece6a"></span>live</span>
</div>
<dc-import name="PixelStrip" effect="field" tint="#9ece6a" load="0.17" seed="21" cell="{{ cell }}" strip-height="{{ bandH }}" still="{{ still }}" hint-size="100%,24px"></dc-import>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8d95bd">Medium load</div>
<div style="background: #16161e; border: 1px solid #292e42; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace">
<div style="display: flex; align-items: center; gap: 24px; height: 44px; padding: 0 16px">
<div style="display: flex; align-items: center; gap: 5px">
<span style="font-size: 15px; font-weight: 700; color: #9ece6a">factory</span>
<span aria-hidden="true" style="display: block; width: 8px"><dc-import name="PixelStrip" effect="caret" tint="#9ece6a" rate="1" cell="4" strip-height="12" still="{{ still }}" hint-size="8px,12px"></dc-import></span>
</div>
<nav style="display: flex; gap: 20px; font-size: 12px">
<a href="#status">status</a>
<a href="#lanes">lanes</a>
<a href="#jobs">jobs</a>
<a href="#log">log</a>
</nav>
<span style="flex-grow: 1"></span>
<span style="font-size: 12px; color: #8d95bd">6 / 12 slots running</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9ece6a"><span aria-hidden="true" style="width: 8px; height: 8px; background: #9ece6a"></span>live</span>
</div>
<dc-import name="PixelStrip" effect="field" tint="#9ece6a" load="0.5" seed="22" cell="{{ cell }}" strip-height="{{ bandH }}" still="{{ still }}" hint-size="100%,24px"></dc-import>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8d95bd">Full load</div>
<div style="background: #16161e; border: 1px solid #292e42; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace">
<div style="display: flex; align-items: center; gap: 24px; height: 44px; padding: 0 16px">
<div style="display: flex; align-items: center; gap: 5px">
<span style="font-size: 15px; font-weight: 700; color: #9ece6a">factory</span>
<span aria-hidden="true" style="display: block; width: 8px"><dc-import name="PixelStrip" effect="caret" tint="#9ece6a" rate="1" cell="4" strip-height="12" still="{{ still }}" hint-size="8px,12px"></dc-import></span>
</div>
<nav style="display: flex; gap: 20px; font-size: 12px">
<a href="#status">status</a>
<a href="#lanes">lanes</a>
<a href="#jobs">jobs</a>
<a href="#log">log</a>
</nav>
<span style="flex-grow: 1"></span>
<span style="font-size: 12px; color: #8d95bd">12 / 12 slots running</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9ece6a"><span aria-hidden="true" style="width: 8px; height: 8px; background: #9ece6a"></span>live</span>
</div>
<dc-import name="PixelStrip" effect="field" tint="#9ece6a" load="1" seed="23" cell="{{ cell }}" strip-height="{{ bandH }}" still="{{ still }}" hint-size="100%,24px"></dc-import>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cell":{"editor":"int","min":2,"max":8,"default":4,"unit":"px","section":"Pixel grid"},"bandH":{"editor":"int","min":12,"max":48,"default":24,"unit":"px","section":"Pixel grid"},"still":{"editor":"boolean","default":false,"section":"Motion"},"$preview":{"width":1280,"height":470}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var cell = Number(p.cell);
    var bandH = Number(p.bandH);
    return {
      cell: isFinite(cell) && cell > 0 ? cell : 4,
      bandH: isFinite(bandH) && bandH > 0 ? bandH : 24,
      still: p.still === true || p.still === 'true'
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slot card playground</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 920px; height: 560px; box-sizing: border-box; padding: 40px; background: #1a1b26; color: #c0caf5; font-family: 'Geist', system-ui, sans-serif; display: flex; gap: 40px">

<div style="width: 440px; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-size: 20px; font-weight: 600; color: #c0caf5">Playground</h1>
<dc-import name="SlotCard" mode="{{ mode }}" bot="{{ bot }}" progress="{{ progress }}" beat="{{ beat }}" done="{{ done }}" still="{{ still }}" cell="{{ cell }}" tint-mix="{{ tintMix }}" verbs="{{ verbs }}" seed="3" label="#482 · T-1193" hint-size="100%,131px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8d95bd">Same strip, cells at 2×</div>
<dc-import name="PixelStrip" effect="{{ effect }}" tint="{{ stripTint }}" tint-mix="{{ tintMix }}" progress="{{ progress }}" beat="{{ beat }}" done="{{ done }}" still="{{ still }}" cell="{{ cell2 }}" seed="3" strip-height="48" hint-size="100%,48px"></dc-import>
</div>
</div>

<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px">

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8d95bd">State</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ states }}" as="s" hint-placeholder-count="9">
<button type="button" onClick="{{ s.pick }}" aria-pressed="{{ s.on }}" style="height: 44px; padding: 0 8px; font-family: inherit; font-size: 12px; cursor: pointer; background: {{ s.bg }}; color: {{ s.fg }}; border: 1px solid {{ s.bd }}">{{ s.label }}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8d95bd">Bot</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ bots }}" as="b" hint-placeholder-count="3">
<button type="button" onClick="{{ b.pick }}" aria-pressed="{{ b.on }}" style="height: 44px; padding: 0 8px; font-family: inherit; font-size: 12px; cursor: pointer; background: {{ b.bg }}; color: {{ b.fg }}; border: 1px solid {{ b.bd }}">{{ b.label }}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8d95bd">Events</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" onClick="{{ sendBeat }}" style="height: 44px; padding: 0 8px; font-family: inherit; font-size: 12px; cursor: pointer; background: #16161e; color: #c0caf5; border: 1px solid #414868">Send heartbeat</button>
<button type="button" onClick="{{ toggleDone }}" aria-pressed="{{ done }}" style="height: 44px; padding: 0 8px; font-family: inherit; font-size: 12px; cursor: pointer; background: #16161e; color: #9ece6a; border: 1px solid #9ece6a">{{ doneLabel }}</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pg-progress" style="display: flex; gap: 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8d95bd"><span>Build progress</span><span style="flex-grow: 1"></span><span style="color: #c0caf5">{{ progressLabel }}</span></label>
<input id="pg-progress" type="range" min="0" max="100" step="1" value="{{ progressPct }}" onChange="{{ setProgress }}" style="width: 100%; height: 24px; margin: 0; accent-color: #9ece6a">
</div>

<label for="pg-still" style="display: flex; align-items: center; gap: 10px; min-height: 44px; color: #c0caf5; cursor: pointer">
<input id="pg-still" type="checkbox" checked="{{ still }}" onChange="{{ toggleStill }}" style="width: 18px; height: 18px; margin: 0; accent-color: #9ece6a">
<span>Reduced motion: one still frame</span>
</label>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cell":{"editor":"int","min":2,"max":8,"default":4,"unit":"px","section":"Pixel grid"},"tintMix":{"editor":"range","min":0,"max":1,"step":0.05,"default":1,"section":"Pixel grid"},"verbs":{"editor":"boolean","default":true,"section":"Motion"},"$preview":{"width":920,"height":560}}'>
class Component extends DCLogic {
  _s() {
    return this.state || {};
  }

  renderVals() {
    var self = this;
    var s = this._s();
    var p = this.props;
    var mode = s.mode || 'build';
    var bot = s.bot || 'claude';
    var progress = s.progress == null ? 0.6 : s.progress;
    var done = !!s.done;
    var still = !!s.still;
    var beat = s.beat || 0;

    var cell = Number(p.cell);
    if (!isFinite(cell) || cell <= 0) cell = 4;
    var tintMix = p.tintMix == null ? 1 : Number(p.tintMix);
    if (!isFinite(tintMix)) tintMix = 1;

    var skin = function (sel) {
      return sel ? ['#9ece6a', '#9ece6a', '#1c2418'] : ['#c0caf5', '#414868', '#16161e'];
    };

    var defaultBot = { plan: 'cursor', review: 'codex' };
    var modes = ['plan', 'build', 'review', 'fix', 'claimed', 'stale', 'dead', 'idle', 'held'];
    var states = modes.map(function (m) {
      var k = skin(m === mode);
      return {
        label: m, on: m === mode, fg: k[0], bd: k[1], bg: k[2],
        pick: function () {
          self.setState({ mode: m, done: false, bot: defaultBot[m] || 'claude' });
        }
      };
    });

    var bots = ['claude', 'codex', 'cursor'].map(function (b) {
      var k = skin(b === bot);
      return {
        label: b, on: b === bot, fg: k[0], bd: k[1], bg: k[2],
        pick: function () {
          self.setState({ bot: b });
        }
      };
    });

    var effects = {
      plan: 'field', build: 'fill', review: 'scan', fix: 'patch',
      claimed: 'spin3', stale: 'decay', dead: 'static', idle: 'twinkle', held: 'off'
    };
    var tints = { claude: '#e0af68', codex: '#7aa2f7', cursor: '#bb9af7' };
    var stripTint = mode === 'dead' ? '#f7768e' : mode === 'idle' ? '#9ece6a' : (tints[bot] || tints.claude);

    return {
      mode: mode,
      bot: bot,
      progress: progress,
      progressPct: Math.round(progress * 100),
      progressLabel: Math.round(progress * 100) + '% of timeout',
      done: done,
      doneLabel: done ? 'Reset' : 'Mark done',
      still: still,
      beat: beat,
      cell: cell,
      cell2: cell * 2,
      tintMix: tintMix,
      verbs: !(p.verbs === false || p.verbs === 'false'),
      effect: effects[mode] || 'off',
      stripTint: stripTint,
      states: states,
      bots: bots,
      sendBeat: function () {
        self.setState({ beat: (self._s().beat || 0) + 1 });
      },
      toggleDone: function () {
        self.setState({ done: !self._s().done });
      },
      setProgress: function (e) {
        self.setState({ progress: Number(e.target.value) / 100 });
      },
      toggleStill: function (e) {
        self.setState({ still: !!e.target.checked });
      }
    };
  }
}
</script>
</body>
</html>

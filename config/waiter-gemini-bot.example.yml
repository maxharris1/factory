# Example waiter config for gemini-bot (~/.config/factory/waiter-gemini-bot.yml).
# The harness is Google's Antigravity CLI, `agy`. The waiter passes the brief on
# stdin with its path in ORCH_JOB_BRIEF, and injects `--output-format stream-json`
# when `-p`, `--print` or `--prompt` is present without an explicit format.
# The command runs with no shell, so `$ORCH_JOB_BRIEF` reaches agy as written and
# names the variable the agent reads.
command:
  - agy
  - -p
  - Read the brief at $ORCH_JOB_BRIEF and follow it.
  - --dangerously-skip-permissions

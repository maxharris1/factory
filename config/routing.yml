# Central pstack benchmark-driven role routing table (E2-4).
#
# Assigns ordered `(harness, model, effort)` preference pools to each factory
# and pstack role across Claude, Codex, Gemini, and Cursor.
#
# - `budget` selects the active cost/effort tier: unlimited, large, medium, small.
# - `review` mechanically filters out any candidate sharing the builder's model
#   family (anthropic / openai / google) and fails closed if none is eligible.
# - Harnesses listed in orch.yml `refused_harnesses` (or currently paused /
#   unavailable) are skipped automatically in preference order.
# - Individual repositories may override `budget` or specific slots via an
#   optional `routing:` block in `factory.md`, or specify `inherit` to fall back
#   to legacy `builder:` / `reviewer:` front matter.
# - `shares.gemini` sends a share of builds and reviews to Gemini
#   (docs/decisions/1830-gemini-shares.md). `roles.review` is the default
#   order; a won draw is the only thing that puts Gemini first. Set `build` or
#   `review` to 0, or remove the block, to turn that share off.
budget: medium

shares:
  gemini:
    build: 0.25
    review: 0.25
    min_headroom: 0.15
    max_builds_in_flight: 2

roles:
  orchestrate:
    - harness: claude
      model: claude-opus-5-5
      effort: medium
    - harness: gemini
      model: gemini-4-neon
      effort: high
    - harness: codex
      model: gpt-6.2-astra
      effort: high

  plan:
    - harness: claude
      model: claude-fable-5-2
      effort: high
    - harness: codex
      model: gpt-6.2-astra
      effort: high
    - harness: gemini
      model: gemini-4-neon
      effort: high

  build:
    - harness: claude
      model: claude-opus-5-5
      effort: medium
    - harness: codex
      model: gpt-6.2-astra
      effort: high
    - harness: gemini
      model: gemini-4-neon
      effort: high
    - harness: cursor

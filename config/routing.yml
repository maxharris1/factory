# Central pstack benchmark-driven role routing table (E2-4).
#
# Assigns ordered `(harness, model, effort)` preference pools to each factory
# and pstack role across Claude, Codex, Gemini, and Cursor.
#
# - `budget` selects the active cost/effort tier: unlimited, large, medium, small.
# - `review` mechanically filters out any candidate sharing the builder's model
#   family (anthropic / openai / google) and fails closed if none is eligible.
# - Harnesses listed in orch.yml `refused_harnesses` (or currently paused /
#   unavailable) are skipped automatically in preference order.
# - Individual repositories may override `budget` or specific slots via an
#   optional `routing:` block in `factory.md`, or specify `inherit` to fall back
#   to legacy `builder:` / `reviewer:` front matter.
budget: medium

roles:
  orchestrate:
    - harness: claude
      model: claude-opus-4-6
      effort: high
    - harness: gemini
      model: gemini-2.5-pro
      effort: high
    - harness: codex
      model: gpt-5.4
      effort: high

  plan:

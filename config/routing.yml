      model: claude-opus-5-5
      effort: medium
    - harness: codex
      model: gpt-6.2-astra
      effort: high
    - harness: gemini
      model: gemini-4-neon
      effort: high

  build:perf:
    - harness: codex
      model: gpt-6.2-astra
      effort: high
    - harness: claude
      model: claude-opus-5-5
      effort: medium
    - harness: gemini
      model: gemini-4-neon
      effort: high

  review:
    - harness: codex
      model: gpt-6.2-sol
      effort: high
    - harness: claude
      model: claude-opus-5-5
      effort: medium
    - harness: gemini
      model: gemini-4-neon
      effort: high

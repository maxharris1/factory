      effort: high

  build:bug:
    - harness: claude
      model: claude-opus-5-5
      effort: medium
    - harness: codex
      model: gpt-6.2-astra
      effort: high
    - harness: gemini
      model: gemini-4-neon
      effort: high

  build:refactor:

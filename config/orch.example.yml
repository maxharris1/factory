# Minimal orch.yml. No field beyond these is required.
# Omitted job_timeout means 60 minutes. See docs/SPEC.md section 7.
# poll_seconds: 30 or 60, slept after each cycle (GitHub every cycle;
# Linear stays on its own 60-second cadence and budget).
poll_seconds: 30
projects:
  - repo: owner/name
    factory_ref: main
    # Optional driver inbox (issue #737): copy each Grok wake to this issue.
    # driver_inbox: owner/name#123
    # grok_webhook: false             # only with driver_inbox; default true
    # Optional devices (issue #1171): machines.yml device names this project's
    # jobs may run on. Omitted means every device. check-config refuses a value
    # that is not a non-empty list of names, and, with --machines, a name
    # machines.yml does not list; a disabled device is a warning. Placement
    # honours it once the placement part of #1082 lands.
    # devices: [pc]
# Optional read-only dashboard push (README "Dashboard"); omit `dashboard`
# to push nothing. `orch poll` pushes status.json and index.html to the
# pc-wsl-bots node as cursor-bot after every poll cycle (add every_minutes: N
# to push less often). The same upload by hand, from the box:
#   scp -F /home/box/.ssh/config status.json index.html pc-wsl-cursor-bot:factory-dashboard/
# i.e. /home/cursor-bot/factory-dashboard, served tailnet-only at
# http://pc-wsl-bots.tail68624b.ts.net:8090/. No secrets: SSH uses the login
# Max provisioned behind that alias. Uncomment `live: true` to also push
# status.json on every orch.db change (at most every 5 seconds, and 5 idle
# seconds after each push ends), which the mission-control page polls for
# real-time updates.
dashboard:
  refresh_seconds: 20
  push:
    transport: ssh
    host: pc-wsl-cursor-bot
    # After orch moves to another device, this is the orch user's own SSH config.
    ssh_config: /home/box/.ssh/config
    remote_dir: factory-dashboard
    method: scp
    # live: true
  # Optional (#777): Mission Control device settings. `orch settings apply`
  # reads requests from this spool on the push host, trusting only files the
  # dashboard server's user owns; without this block it does nothing.
  # settings:
  #   spool: /home/factory-dashboard/settings-spool
  #   spool_owner: factory-dashboard
  #   approver: maxharris1
# Optional: harnesses whose jobs the factory refuses; health then expects
# no waiter for them.
# refused_harnesses:
#   - cursor
# Host-specific values belong in a gitignored orch.local.yml beside this
# file, merged in at load (config/orch.local.example.yml).
# Optional job states (README "Job states"), whole minutes, defaults shown:
# a running job with no heartbeat for stale_minutes is stale; one claimed
# and never started for release_claimed_minutes is requeued (no round charged).
# job_states:
#   stale_minutes: 2
#   release_claimed_minutes: 5
#   driver_wake_minutes: 20   # clarify wake unanswered this long: re-wake, then needs attention
# Optional approval credential (#122, docs/decisions/122-approver-credential.md)
# and per-bot GitHub Apps (#170, docs/decisions/170-four-github-apps.md).
# Each worker bot posts as its own App (#509); any bot may still have one.
# A capped-ticket go and a hold ok then count
# only from approver_logins. enabled: false (the default) keeps today's
# trusted_logins trust. With enabled: true, each App's bot_login must be a
# trusted_logins key for its own bot alone, and every App needs an
# installation for each project owner. orch never opens private_key_file.
# The numbers below are fake.
# approver_logins:
#   - maxharris1
# approver_gh_config_dir: /home/grok/.config/factory/gh-approver
# github_app:
#   enabled: false
#   apps:
#     claude-bot:
#       bot_login: factory-claude[bot]
#       app_id: 222222
#       installations:
#         maxharris1: 2000001
#       private_key_file: /home/box/.config/factory/apps/claude.pem
#     codex-bot:
#       bot_login: factory-codex[bot]
#       app_id: 333333
#       installations:

# Example machines.yml: orch runs on the pc, and the box is a remote device.
# See docs/SPEC.md section 13 and the shipped machines.yml.
# orch_host names the device that runs orch. With no local: true device it is
# required; a local device would have to be the orch host.
orch_host: pc
# accounts names each subscription (#772). id is a stable, non-secret name
# (letters, digits, '.', '_' and '-'), never an email, org ID or token.
# harness is claude, codex, cursor, or external (a plan no factory process
# runs; `orch usage record` writes its readings). A bare bot value under a
# device's harnesses means the account <harness>-default, which needs no
# entry. signed_in_on lists the devices a claude or codex account is signed
# in on; each such device names home, the bot's home folder, and the
# account's folder there is <home>/.factory-accounts/<id>. Cursor keeps its
# login outside any folder, so a cursor account is each device's cursor-bot
# login, named inline as {bot: cursor-bot, account: <id>}, never signed_in_on.
# cursor-ultra-1 is that login; cursor-grok-ultra records the weekly Ultra
# pool Cursor shares with Grok, which `orch usage record` writes.
accounts:
  - {id: codex-pro-1, harness: codex, plan: pro, label: "Codex Pro", signed_in_on: [pc]}
  - {id: cursor-ultra-1, harness: cursor, plan: ultra, label: "Cursor Ultra"}
  - {id: cursor-grok-ultra, harness: external, plan: ultra, label: "Grok and Cursor Ultra"}
devices:
  - name: pc
    tailscale_name: pc-wsl-bots.example.ts.net
    slot_max: 10
    harnesses:
      claude: claude-bot
      codex: codex-bot
      cursor: {bot: cursor-bot, account: cursor-ultra-1}
    home: /home/{bot}
    # workdir_root is where job worktrees are made (empty at job start).
    # factory_root is the deployed factory checkout (skills/, bin/orch), not
    # workdir_root, and may not sit inside it.
    workdir_root: /home/{bot}/factory-work
    ssh_alias: pc-wsl-{bot}
    factory_root: /home/{bot}/factory
  - name: box
    tailscale_name: factory-box.example.ts.net
    slot_max: 6
    # ssh_user is the login (ssh -l) for this device in place of the bot user.
    # The bot user stays the job's identity: its slot and the {bot} paths.
    ssh_user: box
    harnesses:
      claude: claude-bot
      codex: codex-bot
      cursor: {bot: cursor-bot, account: cursor-ultra-1}
    workdir_root: /home/box/factory-work
    ssh_alias: box-{bot}
    factory_root: /home/box/factory

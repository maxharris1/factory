name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ contains(fromJSON(needs.changes.outputs.hosted || '[]'), format('test-{0}', matrix.shard)) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","factory-linux"]') }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Runner identity
        run: echo "runner $RUNNER_NAME as $(id -un)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Put python3.11 on PATH
        run: |
          uv python install 3.11
          mkdir -p "$RUNNER_TEMP/py311"
          ln -sf "$(uv python find 3.11)" "$RUNNER_TEMP/py311/python3.11"
          echo "$RUNNER_TEMP/py311" >> "$GITHUB_PATH"
      - run: uv pip install -r requirements-dev.txt
      - name: Start a lingering systemd user manager for the run scope tests
        run: |
          user=$(id -un)
          sudo -n loginctl enable-linger "$user" 2>/dev/null || loginctl enable-linger "$user" 2>/dev/null || true
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 20); do
            systemd-run --user --scope --quiet --collect true 2>/dev/null && exit 0
            sleep 0.5
          done
          echo "::warning::no systemd user manager for $user; the run scope tests skip"
      - run: pytest -n ${{ runner.environment == 'self-hosted' && 2 || 4 }} -m "not serial" --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      macos: ${{ steps.diff.outputs.macos }}
      hosted: ${{ steps.route.outputs.hosted }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
          if grep -qxF \
            -e .github/workflows/ci.yml \
            -e lib/device_monitor.py \
            -e lib/job_run.py \
            -e lib/process_tree.py \
            -e lib/qa_evidence.py \
            -e lib/remote.py \
            -e tests/test_job_run.py \
            -e tests/test_process_discovery.py \
            -e tests/test_qa_evidence_recycle.py \
            -e tests/test_remote_start.py \
            -e tests/test_remote_tree.py \
            -e requirements.txt \
            -e requirements-dev.txt \
            <<<"$changed"; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi
      - id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_LINUX_POOL: ${{ vars.FACTORY_LINUX_POOL }}
        run: python3 -I lib/ci_route.py
      - name: local test-1
        if: ${{ !contains(fromJSON(steps.route.outputs.hosted || '[]'), 'test-1') }}
        run: 'true'
      - name: local test-2
        if: ${{ !contains(fromJSON(steps.route.outputs.hosted || '[]'), 'test-2') }}
        run: 'true'
      - name: local test-3
        if: ${{ !contains(fromJSON(steps.route.outputs.hosted || '[]'), 'test-3') }}
        run: 'true'
      - name: local statechart
        if: ${{ !contains(fromJSON(steps.route.outputs.hosted || '[]'), 'statechart') }}
        run: 'true'
      - name: local checks
        if: ${{ !contains(fromJSON(steps.route.outputs.hosted || '[]'), 'checks') }}
        run: 'true'
      - name: local py311-compile
        if: ${{ !contains(fromJSON(steps.route.outputs.hosted || '[]'), 'py311-compile') }}
        run: 'true'
      - name: local macos-pickup
        if: ${{ !contains(fromJSON(steps.route.outputs.hosted || '[]'), 'macos-pickup') }}
        run: 'true'

  macos:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || needs.changes.outputs.macos == 'true')
    runs-on: [self-hosted, macOS, factory-mac]
    timeout-minutes: 15
    steps:
      - name: Runner identity
        run: echo "runner $RUNNER_NAME as $(id -un)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
      - run: uv pip install -r requirements-dev.txt
      - run: pytest tests/test_process_discovery.py tests/test_remote_tree.py tests/test_remote_start.py::test_a_lost_box_jobs_untagged_orphan_born_after_the_last_look_is_killed -p no:xdist -s -rs
      - run: pytest tests/test_job_run.py -k macos -p no:xdist -s -rs -v
      - run: pytest tests/test_qa_evidence_recycle.py -p no:xdist -rs

  macos-pickup:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || needs.changes.outputs.macos == 'true')
    runs-on: ${{ contains(fromJSON(needs.changes.outputs.hosted || '[]'), 'macos-pickup') && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","factory-linux"]') }}
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PICKUP_SECONDS: 600
          POLL_SECONDS: 15
        run: |
          set -euo pipefail
          while true; do
            if job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "macos") | "\(.status) \(.conclusion) \(.created_at)"') && [[ -n "$job" ]]; then
              read -r status conclusion created_at <<<"$job"
              case "$status" in
                completed)
                  [[ "$conclusion" == success ]] && exit 0
                  echo "::error title=macos failed::The macos job finished $conclusion. This watchdog fails with it so rerunning failed jobs reruns the watchdog too."
                  exit 1
                  ;;
                in_progress) ;;
                *)
                  if (( $(date +%s) - $(date -d "$created_at" +%s) >= PICKUP_SECONDS )); then
                    echo "::error title=macos runner pickup::No factory-mac runner picked up the macos job within $((PICKUP_SECONDS / 60)) minutes (queued since $created_at). The Mac runner is offline, asleep or busy, not a test failure. Cancelling this run. Rerun failed jobs to retry. See docs/decisions/628-macos-runner-pickup.md and docs/decisions/711-self-hosted-runners.md."
                    gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
                    exit 1
                  fi
                  ;;
              esac
            fi
            sleep "$POLL_SECONDS"
          done

  checks:
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ contains(fromJSON(needs.changes.outputs.hosted || '[]'), 'checks') && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","factory-linux"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - name: Runner identity
        run: echo "runner $RUNNER_NAME as $(id -un)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
      - run: uv pip install -r requirements-dev.txt
      - name: Quarantined tests link open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tests.quarantine
      - run: pytest -m serial -p no:xdist
      - name: Validate shipped config including install placeholders
        run: python bin/orch check-config --orch orch.yml --allow-placeholders
      - name: Validate placeholder-free example config
        run: python bin/orch check-config --orch config/orch.example.yml
      - name: Validate shipped machines.yml including install placeholders
        run: python bin/orch check-config --orch orch.yml --machines machines.yml --allow-placeholders
      - name: Validate placeholder-free example machines.yml
        run: python bin/orch check-config --orch config/orch.example.yml --machines config/machines.example.yml
      - run: python bin/orch eval-report --input tests/fixtures/eval/week

  py311-compile:
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ contains(fromJSON(needs.changes.outputs.hosted || '[]'), 'py311-compile') && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","factory-linux"]') }}
    timeout-minutes: 5
    steps:
      - name: Runner identity
        run: echo "runner $RUNNER_NAME as $(id -un)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          activate-environment: true
      - run: python -c 'import sys; assert sys.version_info[:2] == (3, 11), sys.version'
      - run: python -m compileall -q lib bin
      - run: python -m py_compile bin/orch bin/skill-probe

  statechart:
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ contains(fromJSON(needs.changes.outputs.hosted || '[]'), 'statechart') && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","factory-linux"]') }}
    timeout-minutes: 15
    steps:
      - name: Runner identity
        run: echo "runner $RUNNER_NAME as $(id -un)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/factory-tlc
            ~/.cache/factory-statechart
          key: statechart-${{ hashFiles('model/check.sh') }}
      - run: bash model/check.sh

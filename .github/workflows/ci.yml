name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, factory-linux]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: |
            3.11
            3.12
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -n 4 -m "not serial" --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, factory-linux]
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.diff.outputs.macos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
          if grep -qxF \
            -e .github/workflows/ci.yml \
            -e lib/job_run.py \
            -e lib/remote.py \
            -e tests/test_process_discovery.py \
            -e requirements.txt \
            -e requirements-dev.txt \
            <<<"$changed"; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || needs.changes.outputs.macos == 'true')
    runs-on: [self-hosted, macOS, factory-mac]
    timeout-minutes: 15
    steps:
      - name: Runner identity
        run: echo "runner $RUNNER_NAME as $(id -un)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/test_process_discovery.py -p no:xdist -s -rs

  macos-pickup:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || needs.changes.outputs.macos == 'true')
    runs-on: [self-hosted, Linux, X64, factory-linux]
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PICKUP_SECONDS: 600
          POLL_SECONDS: 15
        run: |
          set -euo pipefail
          while true; do
            if job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "macos") | "\(.status) \(.conclusion) \(.created_at)"') && [[ -n "$job" ]]; then
              read -r status conclusion created_at <<<"$job"
              case "$status" in
                completed)
                  [[ "$conclusion" == success ]] && exit 0
                  echo "::error title=macos failed::The macos job finished $conclusion. This watchdog fails with it so rerunning failed jobs reruns the watchdog too."
                  exit 1
                  ;;
                in_progress) ;;
                *)
                  if (( $(date +%s) - $(date -d "$created_at" +%s) >= PICKUP_SECONDS )); then
                    echo "::error title=macos runner pickup::No factory-mac runner picked up the macos job within $((PICKUP_SECONDS / 60)) minutes (queued since $created_at). The Mac runner is offline, asleep or busy, not a test failure. Cancelling this run. Rerun failed jobs to retry. See docs/decisions/628-macos-runner-pickup.md and docs/decisions/711-self-hosted-runners.md."
                    gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
                    exit 1
                  fi
                  ;;
              esac
            fi
            sleep "$POLL_SECONDS"
          done

  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, factory-linux]
    timeout-minutes: 15
    steps:
      - name: Runner identity
        run: echo "runner $RUNNER_NAME as $(id -un)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -m serial -p no:xdist
      - name: Validate shipped config including install placeholders
        run: python bin/orch check-config --orch orch.yml --allow-placeholders
      - name: Validate placeholder-free example config
        run: python bin/orch check-config --orch config/orch.example.yml
      - name: Validate shipped machines.yml including install placeholders
        run: python bin/orch check-config --orch orch.yml --machines machines.yml --allow-placeholders
      - name: Validate placeholder-free example machines.yml
        run: python bin/orch check-config --orch config/orch.example.yml --machines config/machines.example.yml
      - run: python bin/orch eval-report --input tests/fixtures/eval/week

  py311-compile:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, factory-linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -c 'import sys; assert sys.version_info[:2] == (3, 11), sys.version'
      - run: python -m compileall -q lib bin
      - run: python -m py_compile bin/orch bin/skill-probe

  statechart:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, factory-linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/factory-tlc
            ~/.cache/factory-statechart
          key: statechart-${{ hashFiles('model/check.sh') }}
      - run: bash model/check.sh

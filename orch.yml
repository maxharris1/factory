# orch.yml schema v1. See docs/SPEC.md section 7.
# Required: poll_seconds, projects[].repo.
# Optional: job_timeout and projects[].job_timeout, in minutes.
# When both are omitted the job timeout is 60 minutes.
# poll_seconds is 30 or 60: the sleep after each cycle, so a cycle's own work
# adds to it. GitHub is read every cycle; Linear keeps its own 60-second
# cadence and budget (README "Poll").
poll_seconds: 30
linear:
  api_key_env: LINEAR_API_KEY
grok:
  webhook_url_env: FACTORY_WEBHOOK_URL
  webhook_auth_env: FACTORY_WEBHOOK_AUTH
  webhook_key_env: FACTORY_WEBHOOK_KEY
# Cursor jobs are refused, so health expects no cursor-bot waiter.
refused_harnesses:
  - cursor
trusted_logins:
  maxharris1:
    - grok-bot
    - claude-bot
    - codex-bot
    - cursor-bot
# Who may give a capped-ticket go or a hold ok once github_app.enabled is
# true (#122, docs/decisions/122-approver-credential.md). Until then
# trusted_logins decides, as before. Each bot gets its own App (#170,
# docs/decisions/170-four-github-apps.md); Max fills in the real numbers
# after he creates them. orch never opens private_key_file. Fake numbers:
approver_logins:
  - maxharris1
# approver_gh_config_dir: /home/grok/.config/factory/gh-approver
# github_app:
#   enabled: false
#   apps:
#     grok-bot:
#       bot_login: factory-grok[bot]
#       app_id: 111111
#       installations:
#         maxharris1: 1000001
#         aut0-code: 1000002
#       private_key_file: /home/box/.config/factory/apps/factory.pem
#     claude-bot:
#       bot_login: factory-claude[bot]
#       app_id: 222222
#       installations:
#         maxharris1: 2000001
#         aut0-code: 2000002
#       private_key_file: /home/box/.config/factory/apps/claude.pem
#     codex-bot:
#       bot_login: factory-codex[bot]
#       app_id: 333333
#       installations:
#         maxharris1: 3000001
#         aut0-code: 3000002
#       private_key_file: /home/box/.config/factory/apps/codex.pem
#     cursor-bot:
#       bot_login: factory-cursor[bot]
#       app_id: 444444
#       installations:
#         maxharris1: 4000001
#         aut0-code: 4000002
#       private_key_file: /home/box/.config/factory/apps/cursor.pem
# Before install, Max must add the confirmed stable Linear user ID under
# trusted_linear_users. The poller refuses Linear polling without it.
# intake (issue #85, docs/SPEC.md section 7): the backlog feeder turns a
# tagged ticket into a draft PR plus brief and go by itself. A GitHub
# project names the label (default factory:ready) a trusted login applies;
# a Linear project names the workflow state a trusted Linear user moves the
# issue to. trusted: defaults to the trusted_logins (GitHub) or
# trusted_linear_users (Linear) keys. A project without intake is not fed.
projects:
  - repo: aut0-code/aut0
    factory_ref: dev
    linear_project_id: REPLACE_WITH_LINEAR_PROJECT_ID
    grok_bot: offer-brief-project
    linear_ready_for_review: true
    job_timeout: 150
    intake:
      linear_state: In Progress
  - repo: maxharris1/Cleffy
    factory_ref: dev
    intake:
      label: factory:ready
  - repo: maxharris1/tracy-harris-coaching
    factory_ref: main
  # The factory's own PRs: GitHub only, no Linear. They are built outside
  # the queue, so a trusted builder ready starts review (README "Poll").
  # factory.md ships by handoff: APPROVE with green CI wakes grok-bot
  # (Factory) to merge; the poller never merges here.
  - repo: maxharris1/factory
    factory_ref: main
    ready_starts_review: true
    intake:
      label: factory:ready
# Host-specific values (the Linear project id, trusted_linear_users,
# linear_webhook, a device's slots) go in the gitignored orch.local.yml
# beside this file, merged in at load (config/orch.local.example.yml).
# Optional Linear webhook listener (README "Linear webhook"). Off unless
# this section is present; the poller then behaves exactly as without it.
# Max saves the Linear signing secret to secret_file (chmod 600).
# linear_webhook:
#   bind: 127.0.0.1:8787
#   path: /linear-webhook
#   secret_file: ~/.config/factory/linear-webhook.secret
#   reconcile_seconds: 900
# Optional read-only dashboard (README "Dashboard"). Push is off unless
# dashboard.push.transport is ssh; then `orch poll` (deploy/poller-service.sh)
# pushes after every poll cycle, or every `every_minutes`, and with
# `live: true` also pushes status.json on every orch.db change (about once a
# second at most) for the real-time mission-control page. It holds no
# secrets; SSH uses the login Max provisioned for the box's
# pc-wsl-cursor-bot alias. The pushed pair lands in
# /home/cursor-bot/factory-dashboard on pc-wsl-bots, served tailnet-only at
# http://pc-wsl-bots.tail68624b.ts.net:8090/ (deploy/factory-dashboard-http.service).
# dashboard:
#   refresh_seconds: 20
#   push:
#     transport: ssh
#     host: pc-wsl-cursor-bot
#     ssh_config: /home/box/.ssh/config
#     remote_dir: factory-dashboard
#     method: scp
#     live: true           # real-time status.json pushes on orch.db changes
#     # every_minutes: 5   # omitted: push after every poll cycle

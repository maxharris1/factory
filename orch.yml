# orch.yml schema v1. See docs/SPEC.md section 7.
# Required: poll_seconds, projects[].repo.
# Optional: job_timeout and projects[].job_timeout, in minutes.
# When both are omitted the job timeout is 60 minutes.
# poll_seconds is 30 or 60: the sleep after each cycle, so a cycle's own work
# adds to it. GitHub is read every cycle; Linear keeps its own 60-second
# cadence and budget (README "Poll").
poll_seconds: 30
linear:
  api_key_env: LINEAR_API_KEY
grok:
  webhook_url_env: FACTORY_WEBHOOK_URL
  webhook_auth_env: FACTORY_WEBHOOK_AUTH
  webhook_key_env: FACTORY_WEBHOOK_KEY
driver: claude
claude:
  fire_url_env: FACTORY_CLAUDE_FIRE_URL
  fire_token_env: FACTORY_CLAUDE_FIRE_TOKEN
trusted_logins:
  maxharris1:
    - grok-bot
    - claude-bot
    - codex-bot
    - cursor-bot
    - gemini-bot
# Who may give a capped-ticket go or a hold ok once github_app.enabled is
# true (#122, docs/decisions/122-approver-credential.md). Until then
# trusted_logins decides, as before. Each worker bot gets its own App (#170,
# #509, docs/decisions/509-worker-apps.md). Grok stays on Max's login. orch
# never opens private_key_file. The numbers below are fake. To switch on,
# Max creates the two Apps and fills in the real app_id, installations and
# private_key_file. He lists an installation for every project owner
# (maxharris1, aut0-code). He adds each App's bot_login as a trusted_logins
# key, as in factory-claude[bot]: [claude-bot] and factory-codex[bot]:
# [codex-bot], because check-config refuses enabled: true otherwise. Then he
# sets enabled: true and runs orch check-config, which must end ok.
approver_logins:
  - maxharris1
# Gemini starts refused until signed in on devices and passing `orch accounts doctor`
# (docs/decisions/1412-gemini-harness.md). Cursor stays enabled (1411-cursor-accounts.md).
refused_harnesses:
  - gemini
# approver_gh_config_dir: /home/grok/.config/factory/gh-approver
# github_app:
#   enabled: false
#   apps:
#     claude-bot:
#       bot_login: factory-claude[bot]
#       app_id: 222222
#       installations:
#         maxharris1: 2000001
#         aut0-code: 2000002
#       private_key_file: /home/box/.config/factory/apps/claude.pem
#     codex-bot:
#       bot_login: factory-codex[bot]
#       app_id: 333333
#       installations:
#         maxharris1: 3000001
#         aut0-code: 3000002
#       private_key_file: /home/box/.config/factory/apps/codex.pem
# Box poller only (#1128): its gh reads, not its writes, use this bot's App
# token. Needs the bot's github_app.apps entry and the box token timer.
# poller_reads_app: claude-bot
# Before install, Max must add the confirmed stable Linear user ID under
# trusted_linear_users. The poller refuses Linear polling without it.
# intake (issue #85, docs/SPEC.md section 7): the backlog feeder turns a
# tagged ticket into a draft PR plus brief and go by itself. A GitHub
# project names the label (default factory:ready) a trusted login applies;
# a Linear project names the workflow state a trusted Linear user moves the
# issue to. trusted: defaults to the trusted_logins (GitHub) or
# trusted_linear_users (Linear) keys. A project without intake is not fed.
# Build order (issue #258): priority_labels is an ordered label list; a
# ticket's tier is the first one it carries, and a ticket with none sorts
# after every tier. priority_from_linear: true (Linear projects) maps Linear
# priority Urgent..Low to tiers 0-3. Inside a tier: urgent, then bug, then
# the ticket that unblocks the most open intake tickets (critical_path_order,
# default true), then the oldest.
projects:
  - repo: aut0-code/aut0
    factory_ref: dev
    linear_project_id: REPLACE_WITH_LINEAR_PROJECT_ID
    grok_bot: offer-brief-project
    linear_ready_for_review: true
    job_timeout: 150
    intake:
      linear_state: In Progress
  - repo: maxharris1/Cleffy
    factory_ref: dev
    intake:
      label: factory:ready
      natural_label: intake-clarify
  - repo: maxharris1/tracy-harris-coaching
    factory_ref: main
  # The factory's own PRs: GitHub only, no Linear. They are built outside
  # the queue, so a trusted builder ready starts review (README "Poll").
  # factory.md sets ship: handoff and finish_line: merge, so the poller
  # merges an approved PR once CI on its head is green.
  - repo: maxharris1/factory
    factory_ref: main
    ready_starts_review: true
    job_timeout: 120
    intake:
      label: factory:ready
      natural_label: intake-clarify
      priority_labels: [priority:p0, priority:p1, priority:p2, priority:p3]
  - repo: maxharris1/coo
    factory_ref: main
    intake:
      label: factory:ready
      natural_label: intake-clarify
# Host-specific values (the Linear project id, trusted_linear_users,
# linear_webhook, a device's slots) go in the gitignored orch.local.yml
# beside this file, merged in at load (config/orch.local.example.yml).
# A project's QA evidence bucket is a host value too (issue #787): set
# projects[].qa_storage there, never here. A factory.md with qa enabled
# needs one (docs/SPEC.md section 7):
#   qa_storage:
#     bucket: factory-qa-owner          # one bucket per owner
#     region: us-east-1
#     # endpoint: https://...           # default https://s3.<region>.amazonaws.com
#     access_key_env: QA_S3_KEY_ID      # variable names only, never values
#     secret_key_env: QA_S3_SECRET
#     evidence_root: /srv/factory/qa-evidence
# Optional Linear webhook listener (README "Linear webhook"). Off unless
# this section is present; the poller then behaves exactly as without it.
# Max saves the Linear signing secret to secret_file (chmod 600).
# linear_webhook:
#   bind: 127.0.0.1:8787
#   path: /linear-webhook
#   secret_file: ~/.config/factory/linear-webhook.secret
#   reconcile_seconds: 900
#   tunnel_alert_minutes: 30
# Optional read-only dashboard (README "Dashboard"). Push is off unless
# dashboard.push.transport is ssh; then `orch poll` (deploy/poller-service.sh)
# pushes after every poll cycle, or every `every_minutes`, and with
# `live: true` also pushes status.json on every orch.db change (at most every
# 5 seconds, and 5 idle seconds after each push ends) for the real-time
# mission-control page. It holds no
# secrets; SSH uses the login Max provisioned for the box's
# pc-wsl-cursor-bot alias. The pushed pair lands in
# /home/cursor-bot/factory-dashboard on pc-wsl-bots, served tailnet-only at
# http://pc-wsl-bots.tail68624b.ts.net:8090/ (deploy/factory-dashboard-http.service).
# dashboard:
#   refresh_seconds: 20
#   push:
#     transport: ssh
#     host: pc-wsl-cursor-bot
#     ssh_config: /home/box/.ssh/config
#     remote_dir: factory-dashboard
#     method: scp
#     live: true           # real-time status.json pushes on orch.db changes
#     # every_minutes: 5   # omitted: push after every poll cycle
#     # qa_budget_gib: 5   # omitted: no QA run is removed from the PC for budget

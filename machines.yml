# machines.yml schema v1. See docs/SPEC.md sections 13 and 17 (F2-01, F2-02).
# orch_host names the device that runs orch and must be a listed device. With
# no local: true device it is required; a local: true device must be it.
# Each device: name, tailscale_name (omitted only on the local device),
# slot_max, harnesses (harness -> its bot OS user), workdir_root (required
# on remote devices, never under /mnt/; a {bot} path component resolves to
# the harness's bot user), ssh_alias (required on remote devices: the
# Host alias in the orch host's own SSH client config, containing {bot}, so
# each bot logs in through its own alias; never a key path, user@ or
# option), factory_root (required on remote devices: the deployed factory
# checkout with skills/ and bin/orch, not workdir_root; same path rules),
# ssh_user (optional on a remote device: the ssh -l login in place of the bot
# user; the bot user stays the job's identity and fills {bot} paths),
# and enabled (default true).
# A disabled device or one with a REPLACE_WITH_ value is never scheduled.
# Slots are counted per device name: list each host (tailscale_name) once.
# F2-02 starts a remote job over `ssh -l <login> <ssh_alias>`; nothing here
# implies a device is reachable.
orch_host: pc
devices:
  # The WSL Ubuntu node on the PC, not the Windows host.
  - name: pc
    tailscale_name: pc-wsl-bots.tail68624b.ts.net
    slot_max: 10
    harnesses:
      claude: claude-bot
      codex: codex-bot
      cursor: cursor-bot
    # Each bot's own home, e.g. /home/codex-bot/factory-work. Jobs stay off
    # the Windows C: drive; /mnt/ is refused.
    workdir_root: /home/{bot}/factory-work
    ssh_alias: pc-wsl-{bot}
    # Each bot's own deployed factory checkout, beside its workdir_root.
    factory_root: /home/{bot}/factory
  - name: box
    tailscale_name: grokbot-factory-box.tail68624b.ts.net
    slot_max: 6
    ssh_user: box
    harnesses:
      claude: claude-bot
      codex: codex-bot
      cursor: cursor-bot
    workdir_root: /home/box/factory-work
    ssh_alias: box-{bot}
    factory_root: /home/box/factory
  # Its bot users do not exist yet and SSH is off. Stays disabled until Max
  # provisions them and enables it.
  - name: mac
    enabled: false
    tailscale_name: maxs-macbook-pro.tail68624b.ts.net
    slot_max: 2
    harnesses: {}
    workdir_root: REPLACE_WITH_MAC_WORKDIR_ROOT
    ssh_alias: REPLACE_WITH_MAC_SSH_ALIAS
    factory_root: /Users/{bot}/factory

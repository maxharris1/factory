# machines.yml schema v1. See docs/SPEC.md sections 13 and 17 (F2-01).
# Each device: name, tailscale_name (omitted only on the local device),
# slot_max, harnesses (harness -> its bot OS user), workdir_root (required
# on remote devices, never under /mnt/; a {bot} path component resolves to
# the harness's bot user), and enabled (default true).
# A disabled device or one with a REPLACE_WITH_ value is never scheduled.
# No device has SSH yet; nothing here implies a device is reachable.
devices:
  # The box runs orch and every bot today (Phase 1).
  - name: box
    local: true
    # One slot per Phase 1 owning bot, each running one blocking `orch wait`:
    # lib/wait.py:35 (OWNING_BOTS) and docs/SPEC.md:33 (Factory decision).
    slot_max: 3
    harnesses:
      claude: claude-bot
      codex: codex-bot
      cursor: cursor-bot
  # The WSL Ubuntu node on the PC, not the Windows host.
  # Stays disabled until F2-02 remote start lands (Factory, Nov 11).
  # F2-02 reaches it through the box's SSH aliases pc-wsl-claude-bot,
  # pc-wsl-codex-bot and pc-wsl-cursor-bot, one per bot user.
  - name: pc
    enabled: false
    tailscale_name: pc-wsl-bots.tail68624b.ts.net
    slot_max: 3
    harnesses:
      claude: claude-bot
      codex: codex-bot
      cursor: cursor-bot
    # Each bot's own home, e.g. /home/codex-bot/factory-work. Jobs stay off
    # the Windows C: drive; /mnt/ is refused.
    workdir_root: /home/{bot}/factory-work
  # Its bot users do not exist yet and SSH is off. Stays disabled until
  # F2-02 remote start lands.
  - name: mac
    enabled: false
    tailscale_name: maxs-macbook-pro.tail68624b.ts.net
    slot_max: 2
    harnesses: {}
    workdir_root: REPLACE_WITH_MAC_WORKDIR_ROOT

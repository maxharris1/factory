[pytest]
pythonpath = .
testpaths = tests
addopts = -p tests.shm_temp -p tests.child_reaper -p tests.shard -p tests.quarantine
markers =
    serial: runs outside xdist workers; CI runs these in its own pass (#311)
    job_bound: the dispatcher accepts only a ready or verdict a job registered (#194)
timeout = 120
timeout_method = signal
